services:
  janavani-api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "src.web.canonical_app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      REDIS_HOST: transient-memory-grid
      REDIS_PORT: "6379"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
      HUGGINGFACE_TRANSLATION_URL: ${HUGGINGFACE_TRANSLATION_URL:-https://api-inference.huggingface.co/models/ai4bharat/indictrans2-en-indic-1b}
    depends_on:
      transient-memory-grid:
        condition: service_started
    networks:
      - janavani-core

  transient-memory-grid:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    expose:
      - "6379"
    networks:
      - janavani-core

networks:
  janavani-core:
    driver: bridge
