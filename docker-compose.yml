version: '3.8'

services:
  # External facing security guard gateway
  reverse-proxy-gateway:
    image: nginx:alpine
    container_name: janavani-nginx-gateway
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/certs/janavani_live.crt:/etc/ssl/certs/janavani_live.crt:ro
      - /etc/ssl/private/janavani_live.key:/etc/ssl/private/janavani_live.key:ro
    depends_on:
      - ai-agent-service
    networks:
      - janavani-secure-mesh

  # Core Python runtime containing AI modules
  ai-agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: janavani-ai-agent
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=transient-memory-grid
      - REDIS_PORT=6379
      - OLLAMA_BASE_URL=http://local-slm-sandbox:11434
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-mock-verification-token}
      - HF_TOKEN=${HF_TOKEN:-mock-verification-token}
    depends_on:
      - transient-memory-grid
      - local-slm-sandbox
    networks:
      - janavani-secure-mesh

  # Air-Gapped Local Inference Engine
  local-slm-sandbox:
    image: ollama/ollama:latest
    container_name: janavani-local-slm
    volumes:
      - ./ollama_storage:/root/.ollama
    networks:
      - janavani-secure-mesh

  # FastHTML Web MVP Frontend Application
  web-mvp-application:
    image: python:3.11-slim
    container_name: janavani-web-mvp-app
    command: sh -c "pip install -r src/web_mvp/requirements.txt && python src/web_mvp/main.py"
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - JANAVANI_BACKEND_URL=http://ai-agent-service:8000/api/v1
      - WEB_INTERFACE_TOKEN=web-mvp-token-abc
    ports:
      - "8080:8080"
    depends_on:
      - ai-agent-service
    networks:
      - janavani-secure-mesh

  # Internal Admin UI Dashboard Component Instance
  internal-admin-board:
    image: python:3.11-slim
    container_name: janavani-admin-panel
    command: sh -c "pip install streamlit requests pandas && streamlit run src/web/admin_dashboard.py --server.port=8501 --server.address=0.0.0.0"
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - JANAVANI_INTERNAL_API_URL=http://ai-agent-service:8000/api/v1/agent/metrics
      - JANAVANI_INTERNAL_FEEDBACK_URL=http://ai-agent-service:8000/api/v1/feedback/summary
      - ADMIN_INTERFACE_SECRET_TOKEN=web-mvp-token-abc
    ports:
      - "8501:8501"
    depends_on:
      - ai-agent-service
    networks:
      - janavani-secure-mesh

  # Non-persistent, zero-disk internal volatile cache structure
  transient-memory-grid:
    image: redis:7-alpine
    container_name: janavani-redis
    command: redis-server --appendonly no --save ""
    ports:
      - "6379:6379"
    networks:
      - janavani-secure-mesh

  # Dioxus WebAssembly Dev Compilation Container Toolchain
  dioxus-frontend-app:
    image: rust:1.78-slim
    container_name: janavani-dioxus-compiler
    command: sh -c "apt-get update && apt-get install -y pkg-config libssl-dev binaryen && cargo install dioxus-cli && cd src/web_dioxus && dx build --platform web"
    volumes:
      - .:/workspace
    working_dir: /workspace
    networks:
      - janavani-secure-mesh

networks:
  janavani-secure-mesh:
    driver: bridge
