      - HF_TOKEN=${HUGGINGFACE_API_KEY}
    depends_on:
      - transient-memory-grid
    networks:
      - janavani-secure-mesh

  # Isolated Internal Admin UI Dashboard Component Instance
  internal-admin-board:
    image: python:3.11-slim
    container_name: janavani-admin-panel
    command: sh -c "pip install streamlit requests pandas && streamlit run src/web/admin_dashboard.py --server.port=8501 --server.address=0.0.0.0"
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - JANAVANI_INTERNAL_API_URL=http://ai-agent-service:8000/api/v1/agent/metrics
      - ADMIN_INTERFACE_SECRET_TOKEN=web-mvp-token-abc
    ports:
      - "8501:8501"
    depends_on:
      - ai-agent-service
    networks:
      - janavani-secure-mesh

  transient-memory-grid:
    image: redis:7-alpine
    command: redis-server --appendonly no --save ""
    networks:
      - janavani-secure-mesh

networks:
  janavani-secure-mesh:
    driver: bridge


