services:
  reverse-proxy-gateway:
    image: nginx:alpine
    container_name: janavani-nginx-gateway
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/certs/janavani_live.crt:/etc/ssl/certs/janavani_live.crt:ro
      - /etc/ssl/private/janavani_live.key:/etc/ssl/private/janavani_live.key:ro
    depends_on:
      - ai-agent-service
    networks:
      - janavani-secure-mesh

  ai-agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_HOST: transient-memory-grid
      REDIS_PORT: "6379"
      OLLAMA_BASE_URL: http://local-slm-sandbox:11434
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
    depends_on:
      - transient-memory-grid
      - local-slm-sandbox
    networks:
      - janavani-secure-mesh

  local-slm-sandbox:
    image: ollama/ollama:latest
    container_name: janavani-local-slm
    volumes:
      - ./ollama_storage:/root/.ollama
    networks:
      - janavani-secure-mesh

  web-mvp-application:
    image: python:3.11-slim
    container_name: janavani-web-mvp-app
    command: sh -c "pip install -r src/web_mvp/requirements.txt && python src/web_mvp/main.py"
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      JANAVANI_BACKEND_URL: http://ai-agent-service:8000/api/v1
      WEB_INTERFACE_TOKEN: ${WEB_INTERFACE_TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      - ai-agent-service
    networks:
      - janavani-secure-mesh

  internal-admin-board:
    image: python:3.11-slim
    container_name: janavani-admin-panel
    command: sh -c "pip install streamlit requests pandas && streamlit run src/web/admin_dashboard.py --server.port=8501 --server.address=0.0.0.0"
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      JANAVANI_INTERNAL_API_URL: http://ai-agent-service:8000/api/v1/agent/metrics
      JANAVANI_INTERNAL_FEEDBACK_URL: http://ai-agent-service:8000/api/v1/feedback/summary
      ADMIN_INTERFACE_SECRET_TOKEN: ${ADMIN_INTERFACE_SECRET_TOKEN:-}
    ports:
      - "8501:8501"
    depends_on:
      - ai-agent-service
    networks:
      - janavani-secure-mesh

  dioxus-frontend-app:
    image: rust:1.78-slim
    container_name: janavani-dioxus-compiler
    command: sh -c "apt-get update && apt-get install -y pkg-config libssl-dev binaryen && cargo install dioxus-cli && cd src/web_dioxus && dx build --platform web"
    volumes:
      - .:/workspace
    working_dir: /workspace
    networks:
      - janavani-secure-mesh

  transient-memory-grid:
    image: redis:7-alpine
    command: redis-server --appendonly no --save ""
    networks:
      - janavani-secure-mesh

networks:
  janavani-secure-mesh:
    driver: bridge
