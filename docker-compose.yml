version: '3.8'

services:
  reverse-proxy-gateway:
    image: nginx:alpine
    container_name: janavani-nginx-gateway
    ports:
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/certs/janavani_live.crt:/etc/ssl/certs/janavani_live.crt:ro
      - /etc/ssl/private/janavani_live.key:/etc/ssl/private/janavani_live.key:ro
    depends_on:
      - ai-agent-service
    networks:
      - janavani-secure-mesh

  ai-agent-service:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - REDIS_HOST=transient-memory-grid
      - REDIS_PORT=6379
      # Point directly to the internal air-gapped container url instead of external cloud vendors
      - OLLAMA_BASE_URL=http://local-slm-sandbox:11434
    depends_on:
      - transient-memory-grid
      - local-slm-sandbox
    networks:
      - janavani-secure-mesh

  # NEW: Air-Gapped Local Inference Engine (Privacy Default Shield)
  local-slm-sandbox:
    image: ollama/ollama:latest
    container_name: janavani-local-slm
    volumes:
      - ./ollama_storage:/root/.ollama
    # Expose internally inside the isolated bridging network context only
    networks:
      - janavani-secure-mesh

  web-mvp-application:
    image: python:3.11-slim
    container_name: janavani-web-mvp-app
    command: sh -c "pip install -r src/web_mvp/requirements.txt && python src/web_mvp/main.py"
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - JANAVANI_BACKEND_URL=http://ai-agent-service:8000/api/v1
      - WEB_INTERFACE_TOKEN=web-mvp-token-abc
    ports:
      - "8080:8080"
    depends_on:
      - ai-agent-service
    networks:
      - janavani-secure-mesh

  transient-memory-grid:
    image: redis:7-alpine
    command: redis-server --appendonly no --save ""
    networks:
      - janavani-secure-mesh

networks:
  janavani-secure-mesh:
    driver: bridge


