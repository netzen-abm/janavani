[package]
name = "janavani-dioxus-web"
version = "1.0.0"
edition = "2021"

[dependencies]
dioxus = { version = "0.5", features = ["web"] }
wasm-bindgen = "0.2"
reqwest = { version = "0.11", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-utils = "0.2" # Accesses local browser window variables cleanly
web-sys = { version = "0.3", features = ["Window", "Location"] }

[profile.release]
opt-level = "z"
lto = true
