<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Janavani citizen civic action workspace — local-first by design.">
  <title>Janavani — Civic Action</title>
  <style>
    :root { font-family: system-ui, sans-serif; color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; background: Canvas; color: CanvasText; }
    main { max-width: 760px; margin: 0 auto; padding: 2rem 1rem 4rem; }
    label { display: block; margin-top: 1rem; font-weight: 650; }
    input, textarea, button { box-sizing: border-box; width: 100%; margin-top: .4rem; padding: .75rem; font: inherit; }
    textarea { min-height: 9rem; resize: vertical; }
    button { cursor: pointer; }
    .privacy { border: 1px solid currentColor; padding: .9rem; margin: 1rem 0; }
    .status { min-height: 1.5rem; margin-top: 1rem; }
    .cases { margin-top: 2rem; }
    .case { border: 1px solid currentColor; padding: .8rem; margin-top: .7rem; }
  </style>
</head>
<body>
<main>
  <header>
    <p><strong>JANAVANI</strong></p>
    <h1>Describe a civic issue</h1>
    <p>Create a civic action on your device. Your private case data is stored locally.</p>
  </header>

  <section class="privacy" aria-label="Privacy by design">
    <strong>Privacy by design</strong>
    <p>Your case is encrypted before it is stored in this browser. It is not sent to AI or Agentic AI.</p>
  </section>

  <form id="case-form">
    <label for="title">What is the issue?</label>
    <input id="title" name="title" required maxlength="200" autocomplete="off">

    <label for="description">Describe what happened</label>
    <textarea id="description" name="description" required maxlength="10000"></textarea>

    <label for="location">Location (optional)</label>
    <input id="location" name="location" maxlength="500" autocomplete="off">

    <label for="category">Category (optional)</label>
    <input id="category" name="category" maxlength="100" autocomplete="off">

    <button type="submit">Save securely on this device</button>
  </form>
  <p id="status" class="status" role="status" aria-live="polite"></p>

  <section class="cases" aria-labelledby="saved-heading">
    <h2 id="saved-heading">Saved on this device</h2>
    <div id="case-list"></div>
  </section>
</main>
<script type="module">
  import { createLocalCaseRepository } from "./secure_case_store.js";

  const repositoryPromise = createLocalCaseRepository();
  const form = document.querySelector("#case-form");
  const status = document.querySelector("#status");
  const list = document.querySelector("#case-list");

  function render(cases) {
    list.replaceChildren();
    if (!cases.length) {
      list.textContent = "No civic actions saved yet.";
      return;
    }
    for (const item of cases) {
      const card = document.createElement("article");
      card.className = "case";
      const title = document.createElement("strong");
      title.textContent = item.payload.title;
      const meta = document.createElement("p");
      meta.textContent = `${item.status} · ${new Date(item.created_at).toLocaleString()}`;
      card.append(title, meta);
      list.append(card);
    }
  }

  async function refresh() {
    const repository = await repositoryPromise;
    render(await repository.list());
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    status.textContent = "Saving locally…";
    try {
      const data = new FormData(form);
      const repository = await repositoryPromise;
      await repository.create({
        title: data.get("title"),
        description: data.get("description"),
        location: data.get("location") || null,
        category: data.get("category") || null,
      });
      form.reset();
      status.textContent = "Saved securely on this device.";
      await refresh();
    } catch (error) {
      status.textContent = `Could not save locally: ${error.message}`;
    }
  });

  refresh().catch((error) => {
    status.textContent = `Local vault unavailable: ${error.message}`;
  });
</script>
</body>
</html>
