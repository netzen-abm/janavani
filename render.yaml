services:
  - type: web
    name: janavani-web
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 src/web.py

  - type: web
    name: janavani-telegram-webhook
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python3 src/bot_telegram.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: JANAVANI_AGENT_BASE_URL
        sync: false
      - key: JANAVANI_TELEGRAM_INTERFACE_TOKEN
        sync: false

  - type: web
    name: janavani-interactive-webapp
    env: python
    plan: free
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install -r src/web_mvp/requirements.txt
    startCommand: uvicorn src.web_mvp.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: JANAVANI_AGENT_BASE_URL
        sync: false
      - key: JANAVANI_WEB_INTERFACE_TOKEN
        sync: false
