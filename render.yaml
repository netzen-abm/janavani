services:
  - type: web
    name: janavani-web-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Canonical Web/API runtime. Keep this service independent of Telegram.
    startCommand: uvicorn src.web.canonical_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /liveness

  - type: web
    name: janavani-telegram-webhook
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Telegram webhook uses HTTPS ingress; do not run polling alongside it.
    startCommand: uvicorn src.web.telegram_webhook_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /liveness
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: JANAVANI_TELEGRAM_INBOX_DSN
        sync: false
      - key: JANAVANI_RUNTIME_MODE
        value: test
      - key: JANAVANI_CASE_CONTENT_POLICY
        value: transient
