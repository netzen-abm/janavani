services:
  - type: web
    name: janavani-web-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Canonical Web/API runtime. Keep this service independent of Telegram.
    startCommand: uvicorn src.web.canonical_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /liveness
    envVars:
      - key: JANAVANI_RUNTIME_MODE
        value: test
      - key: JANAVANI_IDENTITY_ASSERTION_SECRET
        sync: false
      - key: JANAVANI_IDENTITY_ASSERTION_ISSUER
        value: janavani-identity
      - key: JANAVANI_IDENTITY_ASSERTION_AUDIENCE
        value: janavani-api

  - type: web
    name: janavani-webapp
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Browser UI only; OIDC client credentials are unique to this service.
    startCommand: uvicorn src.webapp.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /liveness
    envVars:
      - key: JANAVANI_RUNTIME_MODE
        value: test
      - key: JANAVANI_WEB_API_URL
        sync: false
      - key: JANAVANI_WEB_SESSION_SECRET
        sync: false
      - key: JANAVANI_IDENTITY_ASSERTION_SECRET
        sync: false
      - key: JANAVANI_IDENTITY_ASSERTION_ISSUER
        value: janavani-identity
      - key: JANAVANI_IDENTITY_ASSERTION_AUDIENCE
        value: janavani-api
      - key: JANAVANI_OIDC_ISSUER_URL
        sync: false
      - key: JANAVANI_OIDC_CLIENT_ID
        sync: false
      - key: JANAVANI_OIDC_CLIENT_SECRET
        sync: false
      - key: JANAVANI_OIDC_REDIRECT_URI
        sync: false

  - type: web
    name: janavani-telegram-webhook
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Telegram webhook uses HTTPS ingress; do not run polling alongside it.
    startCommand: PYTHONPATH=src uvicorn src.web.telegram_webhook_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /liveness
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: JANAVANI_TELEGRAM_INBOX_DSN
        sync: false
      - key: JANAVANI_RUNTIME_MODE
        value: test
      - key: JANAVANI_CASE_CONTENT_POLICY
        value: transient
      - key: JANAVANI_IDENTITY_ASSERTION_SECRET
        sync: false
      - key: JANAVANI_IDENTITY_ASSERTION_ISSUER
        value: janavani-identity
      - key: JANAVANI_IDENTITY_ASSERTION_AUDIENCE
        value: janavani-api
