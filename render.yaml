services:
  - type: web
    name: janavani-platform-api
    env: python

    plan: free

    buildCommand: pip install -r requirements.txt

    # Canonical FastAPI runtime entry point.
    # The historical Flask entry point (src/web.py) is no longer used for deployment.
    startCommand: uvicorn src.web.canonical_app:app --host 0.0.0.0 --port $PORT
