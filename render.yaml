services:
  - type: web
    name: janavani-bot
    env: python

    plan: free

    buildCommand: pip install -r requirements.txt

    # Canonical production API runtime. Telegram is an independent surface
    # and must not be spawned as a child process of the web runtime.
    startCommand: uvicorn src.web.canonical_app:app --host 0.0.0.0 --port $PORT
