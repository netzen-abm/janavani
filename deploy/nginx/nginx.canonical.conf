# JANAVANI — CANONICAL REVERSE PROXY
#
# This file is the canonical deployment baseline. It intentionally contains
# one events block and one http block. TLS certificates/hostnames are deployment
# concerns and must be supplied by the target environment.

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream janavani_api {
        server janavani-api:8000;
    }

    server {
        listen 80;
        server_name _;

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://janavani_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
