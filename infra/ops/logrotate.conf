/var/log/nginx/*.log {
    # Rotate server log footprints daily
    daily
    # Retain record footprints for exactly 7 cycles before permanent extraction
    rotate 7
    # Compress historical logs using gzip algorithms to minimize host disk storage consumption
    compress
    delaycompress
    # Bypass execution routines throwing errors if an active interface log file is missing
    missingok
    # Do not rotate empty tracking log tables
    notifempty
    # Enforce file permission boundaries explicitly on generated archive iterations
    create 0640 nginx adm
    sharedscripts
    # Flush NGINX file descriptors to apply changes without restarting the proxy service
    postrotate
        [ -f /var/run/nginx.pid ] && kill -USR1 `cat /var/run/nginx.pid`
    endscript
}
