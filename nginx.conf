events {
    worker_connections 2048; # Enhanced connection handling for multi-interface traffic
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Anti-DoS Rate Limiting: 10 requests per second maximum per client IP
    limit_req_zone $binary_remote_addr zone=api_limit_zone:15m rate=10r/s;
    # Strict Emergency SOS Rate Limiting: Max 2 alerts per minute per IP to prevent exhaustion
    limit_req_zone $binary_remote_addr zone=sos_limit_zone:5m rate=2r/m;

    server {
        listen 443 ssl;
        server_name api.janavani.internal;

        # Hardened Production TLS Credentials
        ssl_certificate     /etc/ssl/certs/janavani_live.crt;
        ssl_certificate_key /etc/ssl/private/janavani_live.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;

        # Mitigate large memory injection or buffer overflow vectors
        client_max_body_size 2M;

        # Global Proxy Configuration Block
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off; # Prevent stream latency on WebAssembly/Streaming payloads

        # 1. Core Document Generation & Diagnostics Gateway
        location /api/v1/agent/ {
            limit_req zone=api_limit_zone burst=15 nodelay;
            proxy_pass http://ai-agent-service:8000;
        }

        # 2. Public Accountability Feedback Engine
        location /api/v1/feedback/ {
            limit_req zone=api_limit_zone burst=10 nodelay;
            proxy_pass http://ai-agent-service:8000;
        }

        # 3. Geo-Targeted Legislative Directory Engine
        location /api/v1/legislative/ {
            limit_req zone=api_limit_zone burst=20 nodelay;
            proxy_pass http://ai-agent-service:8000;
        }

        # 4. Constitutional Oversight Engine
        location /api/v1/constitutional/ {
            limit_req zone=api_limit_zone burst=10 nodelay;
            proxy_pass http://ai-agent-service:8000;
        }

        # 5. Property Rights & Cadastral Mapping Engine
        location /api/v1/land/ {
            limit_req zone=api_limit_zone burst=5 nodelay; # Throttled for heavy coordinate math
            proxy_pass http://ai-agent-service:8000;
        }

        # 6. HIGH-PRIORITY EMERGENCY SOS CHANNEL
        location /api/v1/agent/trigger-sos {
            limit_req zone=sos_limit_zone burst=1 nodelay; # Isolated rate ceiling
            proxy_pass http://ai-agent-service:8000;
        }
    }
}


# ------------------------------------

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Rate limiting zone: Allows up to 5 requests per second per IP address
    limit_req_zone $binary_remote_addr zone=ai_limit_zone:10m rate=5r/s;

    server {
        listen 443 ssl;
        server_name api.janavani.internal; # Replace with your live public domain

        # SSL/TLS Security Layer Configurations
        ssl_certificate     /etc/ssl/certs/janavani_live.crt;
        ssl_certificate_key /etc/ssl/certs/janavani_live.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Mitigate large buffer memory injection vectors
        client_max_body_size 1M;

        location /api/v1/agent/ {
            # Enforce rate-limiting constraints
            limit_req zone=ai_limit_zone burst=10 nodelay;

            # Route traffic downstream inside the isolated Docker network bridge
            proxy_pass http://ai-agent-service:8000;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Prevent buffering lag on asynchronous streaming actions
            proxy_buffering off;
        }
    }
}
