[package]
name = "janavani"
version = "0.1.0"
edition = "2021"
description = "A citizen-governance bridge with modular decentralized protocol boundaries"

# Protocol flags currently activate contract/stub modules only. Add provider
# crates when their implementations actually consume them; avoid resolving
# unused, speculative dependencies in the default build.
[features]
default = []
freenet = []
nostr = []
nym = []
reticulum = []
zkp = []
blockchain = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
