[package]
name = "janavani"
version = "0.1.0"
edition = "2021"
description = "A citizen-governance bridge with modular decentralized protocols"

[features]
default = []

# Protocol capability flags remain adapter-neutral. Concrete SDK/provider
# dependencies belong in future protocol adapters when real integrations exist.
freenet = []
nostr = []
nym = []
reticulum = []
zkp = []
blockchain = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
