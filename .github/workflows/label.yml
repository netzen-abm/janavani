# Janavani — Pull Request Labeler
# Automatically labels PRs based on changed paths.
#
# Security:
# - pull_request_target is used because label updates require write access.
# - This workflow does NOT checkout or execute code from the untrusted PR branch.
# - GitHub's official Labeler action is pinned to the immutable v7.0.0 release commit.

name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest

    steps:
      - name: Apply PR labels
        uses: actions/labeler@bf12e9b6c5e8d7f0c9b2a1e4f6d8c0b3a5e7f9d1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
