name: Security & Component Testing CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Secret & Privacy Vulnerability Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository Base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Code Base for Secret Leaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  security-component-tests:
    name: Security Boundary Component Tests
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout Code Repository Base
        uses: actions/checkout@v4

      - name: Set up Python Environment Pipeline
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Canonical Dependency Contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest fakeredis

      - name: Execute Security Boundary Tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          OPENROUTER_API_KEY: mock-verification-token
          HF_TOKEN: mock-verification-token
        run: python -m pytest -q tests/test_emergency_lockdown.py
