name: Security & Component Testing CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-scan:
    name: Secret & Privacy Vulnerability Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository Base
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Code Base for Secret Leaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  component-testing:
    name: Isolated Component Validation Testing
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout Code Repository Base
        uses: actions/checkout@v4

      - name: Deploy Isolated Docker Environment Grid
        run: |
          echo "OPENROUTER_API_KEY=mock-verification-token" >> .env
          echo "HUGGINGFACE_API_KEY=mock-verification-token" >> .env
          docker compose up -d transient-memory-grid

      - name: Set up Python Environment Pipeline
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Testing Tool Stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Execute Component Verification Engine Suite
        env:
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          OPENROUTER_API_KEY: mock-verification-token
          HUGGINGFACE_API_KEY: mock-verification-token
        run: |
          pytest -v \
            tests/test_canonical_app.py \
            tests/test_case_workflow_api.py \
            tests/test_case_workflow_service.py \
            tests/test_canonical_persistence_composition.py \
            tests/test_canonical_serialization.py \
            tests/test_canonical_repository_serialization.py \
            tests/test_storage_contract.py \
            tests/test_storage_hydration_validation.py \
            tests/test_storage_round_trip.py \
            tests/test_relationship_repository_contract.py \
            tests/test_security_anchors.py \
            tests/test_emergency_lockdown.py \
            tests/test_transport_contract.py

      - name: Tear Down Testing Environments
        if: always()
        run: docker compose down
