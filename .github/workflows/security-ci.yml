name: Security & Component Testing CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  security-scan:
    name: Secret & Privacy Vulnerability Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify code base for secret leaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  component-testing:
    name: Isolated Component Validation Testing
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest fakeredis ruff

      - name: Start transient Redis
        run: |
          echo "OPENROUTER_API_KEY=mock-verification-token" >> .env
          echo "HUGGINGFACE_API_KEY=mock-verification-token" >> .env
          docker compose up -d transient-memory-grid

      - name: Run component tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          OPENROUTER_API_KEY: mock-verification-token
          HF_TOKEN: mock-verification-token
        run: python -m pytest tests -v

      - name: Tear down test environment
        if: always()
        run: docker compose down
