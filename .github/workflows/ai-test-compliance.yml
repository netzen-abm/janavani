name: AI Model Compliance Testing Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Allows manual trigger execution from the GitHub interface

jobs:
  run-compliance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Network and Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Execute Model Integrations Check
        env:
          # Injects both required repository keys safely during execution runtime
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python ai_pipeline.py
