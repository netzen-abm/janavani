name: AI Model Compliance Testing Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-compliance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository Code
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Canonical Dependency Contract
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Execute AI Boundary Compliance Tests
        env:
          OPENROUTER_API_KEY: mock-verification-token
          HUGGINGFACE_API_KEY: mock-verification-token
        run: python -m pytest tests/test_local_slm_prompts.py -v
