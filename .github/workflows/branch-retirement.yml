    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Archive and retire environmental evidence contract after consent governance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected_sanctioned_branches() {
            printf '%s\n' \
              main \
              integration/canonical-platform \
              feat/canonical-case-kernel \
              feat/canonical-civic-action-vertical-slice \
              feat/canonical-sos-contract \
              feat/capability-scoped-consent-agent-enforcement \
              audit/postgres-provider-production-gates \
              chore/ecosystem-shared-capability-infrastructure
          }
          branch="docs/environmental-civic-evidence-contract"
          tag="archive/branches/$branch"
          git_ref="refs/remotes/origin/evidence-retirement"
          expected_pr_head_sha="${{ github.event.pull_request.head.sha }}"
          if [ -z "$expected_pr_head_sha" ]; then
            echo "::error::Merged PR #247 event does not contain its recorded head SHA."
            exit 2
          fi
          count_open_prs_for_branch() {
            local wanted_branch="$1"
            BRANCH="$wanted_branch" REPO="$REPO" \
              gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
                --jq '.[] | select(.head.ref == env.BRANCH and .head.repo.full_name == env.REPO) | .number' \
              | wc -l | tr -d ' '
          }
          consent_tag="archive/branches/feat/capability-activation-governance"
          consent_ready=false
          for attempt in $(seq 1 60); do
            consent_pr="$(gh api "repos/$REPO/pulls/243")"
            consent_merged_at="$(jq -r '.merged_at // empty' <<<"$consent_pr")"
            consent_head="$(jq -r '.head.sha' <<<"$consent_pr")"
            consent_branch_exists=true
            if ! gh api "repos/$REPO/git/ref/heads/feat/capability-activation-governance" >/dev/null 2>&1; then
              consent_branch_exists=false
            fi
            consent_archive="$(gh api "repos/$REPO/git/ref/tags/$consent_tag" --jq '.object.sha' 2>/dev/null || true)"
            if [ -n "$consent_merged_at" ] &&
               [ "$consent_branch_exists" = false ] &&
               [ "$consent_archive" != "$consent_head" ]; then
              echo "::error::Retirement held: PR #243 archive is missing or does not match its merged head."
              exit 2
            fi
            if [ -n "$consent_merged_at" ] &&
               [ "$consent_branch_exists" = false ] &&
               [ "$consent_archive" = "$consent_head" ]; then
              consent_ready=true
              break
            fi
            echo "Waiting for PR #243 merge and exact-head archive-first retirement (attempt $attempt/60)."
            sleep 10
          done
          if [ "$consent_ready" != true ]; then
            echo "::error::Retirement held: PR #243 did not complete merge and exact-head archive retirement within 10 minutes."
            exit 2
          fi
          open_prs="$(count_open_prs_for_branch "$branch")"
          if [ "$open_prs" != "0" ]; then
            echo "::error::Retirement held: another open PR references $branch."
            exit 2
          fi
          if ! gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            evidence_pr="$(gh api "repos/$REPO/pulls/247")"
            evidence_merged_at="$(jq -r '.merged_at // empty' <<<"$evidence_pr")"
            evidence_api_head="$(jq -r '.head.sha' <<<"$evidence_pr")"
            evidence_archive="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$evidence_merged_at" ] ||
               [ "$evidence_api_head" != "$expected_pr_head_sha" ] ||
               [ "$evidence_archive" != "$expected_pr_head_sha" ]; then
              echo "::error::Evidence-contract ref is absent without an archive of the exact closed PR head."
              exit 2
            fi
            remaining="$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | sort)"
            expected="$(expected_sanctioned_branches | sort)"
            if [ "$remaining" != "$expected" ]; then
              echo "::error::Evidence-contract ref is already absent but the eight-ref inventory is not exact."
              printf 'Actual refs:\n%s\nExpected refs:\n%s\n' "$remaining" "$expected"
              exit 2
            fi
            echo "RETIREMENT VERIFIED: PR #243 workflow already archived and retired this merged evidence-contract ref; exactly eight refs remain."
            exit 0
          fi

          head_sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
          if [ "$head_sha" != "$expected_pr_head_sha" ]; then
            echo "::error::Evidence-contract live branch no longer matches the closed PR #247 head."
            exit 2
          fi
          git fetch --no-tags origin "refs/heads/$branch:$git_ref"
          if [ "$(git rev-parse "$git_ref")" != "$expected_pr_head_sha" ] ||
             ! git diff --quiet refs/remotes/origin/main "$git_ref"; then
            echo "::error::Evidence-contract fetched head/tree differs from the closed PR #247 head or merged main."
            exit 2
          fi
          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            archive_sha="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')"
            if [ "$archive_sha" != "$expected_pr_head_sha" ]; then
              echo "::error::Evidence-contract archive tag points to a different closed PR head."
              exit 2
            fi
          else
            gh api --method POST "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$expected_pr_head_sha"
          fi
          archive_sha="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')"
          current_sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
          if [ "$archive_sha" != "$expected_pr_head_sha" ] ||
             [ "$current_sha" != "$expected_pr_head_sha" ]; then
            echo "::error::Evidence-contract archive/head verification failed against the closed PR #247 event head."
            exit 2
          fi
          gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
          if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            echo "::error::Evidence-contract branch still exists after deletion."
            exit 2
          fi
          remaining="$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | sort)"
          expected="$(expected_sanctioned_branches | sort)"
          if [ "$remaining" != "$expected" ]; then
            echo "::error::Expected exactly the eight sanctioned refs after evidence-contract retirement."
              printf 'Actual refs:\n%s\nExpected refs:\n%s\n' "$remaining" "$expected"
            exit 2
          fi
          echo "RETIREMENT VERIFIED: evidence-contract branch archived, deleted and exactly eight refs remain."

  retire-canonical-capability-envelope:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'feat/canonical-capability-execution-envelope' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Archive, verify and retire the merged transition branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="feat/canonical-capability-execution-envelope"
          tag="archive/branches/$branch"
          git_ref="refs/remotes/origin/retirement-candidate"

          # The merged governance PR is the only event allowed to retire this
          # sanctioned transition ref. Its content must already be identical
          # to main. Do not require commit ancestry: squash/rebase merges can
          # legitimately rewrite commit identities while preserving the tree.
          count_open_prs_for_branch() {
            local wanted_branch="$1"
            BRANCH="$wanted_branch" REPO="$REPO" \
              gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.ref == env.BRANCH and .head.repo.full_name == env.REPO) | .number' \
              | wc -l | tr -d ' '
          }
          prs="$(count_open_prs_for_branch "$branch")"
          if [ "$prs" != "0" ]; then
            echo "::error::Retirement held: open PRs still reference $branch."
            exit 2
          fi

          head_sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
          git fetch --no-tags origin "refs/heads/$branch:$git_ref"
          if [ "$(git rev-parse "$git_ref")" != "$head_sha" ]; then
            echo "::error::Retirement held: fetched ref does not match GitHub head."
            exit 2
          fi

          if ! git diff --quiet refs/remotes/origin/main "$git_ref"; then
            echo "::error::Retirement held: branch tree differs from main."
            exit 2
          fi

          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            archive_sha="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')"
            if [ "$archive_sha" != "$head_sha" ]; then
              echo "::error::Retirement held: archive tag already points to a different SHA."
              exit 2
            fi
            echo "ARCHIVE VERIFIED: $branch -> $tag @ $head_sha"
          else
            gh api --method POST "repos/$REPO/git/refs" \
              -f "ref=refs/tags/$tag" \
              -f "sha=$head_sha"
          fi

          archive_sha="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')"
          current_sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
          if [ "$archive_sha" != "$head_sha" ] || [ "$current_sha" != "$head_sha" ]; then
            echo "::error::Retirement held: branch head changed or archive SHA is not exact."
            exit 2
          fi

          gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
          remaining="$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | wc -l | tr -d ' ')"
          if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            echo "::error::Retirement failed: branch ref still exists."
            exit 2
          fi
          if [ "$remaining" -ne 8 ]; then
            echo "::error::Expected exactly eight physical branches after retirement; found $remaining."
            exit 2
          fi
          echo "RETIREMENT VERIFIED: exact archive exists, ref is deleted, and eight physical branches remain."

  retire-rejected-vercel-analytics:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Archive exact rejected head and governance head, then verify eight refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="vercel/install-vercel-web-analytics-6417ji"
          original_head="697ef531d9a02ab9a03b9986efa6b0a633766985"
          original_tag="archive/rejected-analytics/$branch"
          tag="archive/branches/$branch"
          git_ref="refs/remotes/origin/retirement-candidate"

          count_open_prs_for_branch() {
            local wanted_branch="$1"
            BRANCH="$wanted_branch" REPO="$REPO" \
              gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.ref == env.BRANCH and .head.repo.full_name == env.REPO) | .number' \
              | wc -l | tr -d ' '
          }
          prs="$(count_open_prs_for_branch "$branch")"
          if [ "$prs" != "0" ]; then
            echo "::error::Retirement held: open PRs still reference $branch."
            exit 2
          fi

          head_sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
          git fetch --no-tags origin "+refs/heads/$branch:$git_ref" "+refs/heads/main:refs/remotes/origin/main"
          if [ "$(git rev-parse "$git_ref")" != "$head_sha" ]; then
            echo "::error::Retirement held: fetched head differs from GitHub ref."
            exit 2
          fi
          if ! git diff --quiet refs/remotes/origin/main "$git_ref"; then
            echo "::error::Retirement held: governance branch tree is not identical to merged main."
            exit 2
          fi
          if ! git merge-base --is-ancestor "$original_head" "$git_ref"; then
            echo "::error::Original rejected analytics head is not in the archived branch history."
            exit 2
          fi

          ensure_tag() {
            local tag_name="$1"
            local expected_sha="$2"
            local actual_sha
            if gh api "repos/$REPO/git/ref/tags/$tag_name" >/dev/null 2>&1; then
              actual_sha="$(gh api "repos/$REPO/git/ref/tags/$tag_name" --jq '.object.sha')"
              if [ "$actual_sha" != "$expected_sha" ]; then
                echo "::error::Archive tag $tag_name already points to $actual_sha, expected $expected_sha."
                exit 2
              fi
            else
              gh api --method POST "repos/$REPO/git/refs" -f "ref=refs/tags/$tag_name" -f "sha=$expected_sha"
            fi
            actual_sha="$(gh api "repos/$REPO/git/ref/tags/$tag_name" --jq '.object.sha')"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "::error::Archive verification failed for $tag_name."
              exit 2
            fi
            echo "ARCHIVE VERIFIED: $tag_name @ $actual_sha"
          }

          # Preserve the rejected analytics proposal's exact pre-transition commit explicitly.
          ensure_tag "$original_tag" "$original_head"
          # Then archive the exact final ref head that this workflow is about to delete.
          ensure_tag "$tag" "$head_sha"

          current_sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
          if [ "$current_sha" != "$head_sha" ]; then
            echo "::error::Branch head changed after archive verification."
            exit 2
          fi
          gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
          if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            echo "::error::Branch still exists after deletion: $branch"
            exit 2
          fi

          remaining="$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | wc -l | tr -d ' ')"
          echo "Remaining physical branch refs: $remaining"
          if [ "$remaining" -ne 8 ]; then
            echo "::error::Expected eight physical refs after retirement; found $remaining."
            exit 2
          fi
          echo "RETIREMENT VERIFIED: rejected head and transition head archived, branch deleted, eight refs remain."
