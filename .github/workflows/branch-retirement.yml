name: Branch Retirement

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Actually archive and delete eligible legacy branches"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "Type RETIRE-LEGACY-BRANCHES to permit deletion"
        required: true
        type: string
  pull_request:
    types: [closed]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

# Give each PR-close retirement its own durable concurrency slot. GitHub retains only
# one pending run per group; a single global group can silently replace a queued PR event.
# Manual runs are serialized separately and never own the two transition-only refs.
concurrency:
  group: janavani-branch-retirement-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && 'manual' || github.run_id) }}
  cancel-in-progress: false

jobs:
  retire:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Archive and retire legacy branches
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTE: ${{ inputs.execute }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [ "$CONFIRMATION" != "RETIRE-LEGACY-BRANCHES" ]; then
            echo "Invalid confirmation phrase; no refs will be changed."
            exit 1
          fi

          repo="${{ github.repository }}"
          base="main"
          sanctioned=(
            "main"
            "integration/canonical-platform"
            "feat/canonical-case-kernel"
            "feat/canonical-civic-action-vertical-slice"
            "feat/canonical-sos-contract"
            "feat/capability-scoped-consent-agent-enforcement"
            "audit/postgres-provider-production-gates"
            "chore/ecosystem-shared-capability-infrastructure"
          )
          retirement_only=("feat/canonical-capability-execution-envelope")
          transition_only=(
            "feat/capability-activation-governance"
            "docs/environmental-civic-evidence-contract"
          )

          is_sanctioned() {
            local branch="$1"
            for allowed in "${sanctioned[@]}"; do
              [ "$branch" = "$allowed" ] && return 0
            done
            return 1
          }

          is_retirement_only() {
            local branch="$1"
            for candidate in "${retirement_only[@]}"; do
              [ "$branch" = "$candidate" ] && return 0
            done
            return 1
          }

          is_transition_only() {
            local branch="$1"
            for candidate in "${transition_only[@]}"; do
              [ "$branch" = "$candidate" ] && return 0
            done
            return 1
          }

          mapfile -t branches < <(
            gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name'
          )

          count_open_prs_for_branch() {
            local wanted_branch="$1"
            BRANCH="$wanted_branch" REPO="$repo" \
              gh api --paginate "repos/$repo/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.ref == env.BRANCH and .head.repo.full_name == env.REPO) | .number' \
              | wc -l | tr -d ' '
          }

          for branch in "${branches[@]}"; do
            is_sanctioned "$branch" && continue
            if is_retirement_only "$branch"; then
              echo "Retirement-only branch: $branch is deleted only by the post-merge controlled workflow."
              continue
            fi
            if is_transition_only "$branch"; then
              echo "Transition-only branch: $branch is deleted only by its dedicated approval- and archive-gated workflow."
              continue
            fi

            prs="$(count_open_prs_for_branch "$branch")"
            if [ "$prs" != "0" ]; then
              echo "HOLD: $branch (open_prs=$prs)"
              continue
            fi

            head_sha="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
            tag="archive/branches/$branch"
            git_ref="refs/remotes/origin/retirement-candidate"
            git fetch --no-tags origin \
              "+refs/heads/$branch:$git_ref" \
              "+refs/heads/main:refs/remotes/origin/main"
            if [ "$(git rev-parse "$git_ref")" != "$head_sha" ]; then
              echo "HOLD: $branch (GitHub ref and fetched head disagree)"
              continue
            fi
            ahead="$(git rev-list --count "refs/remotes/origin/main..$git_ref")"
            if [ "$ahead" != "0" ]; then
              echo "HOLD: $branch ($ahead commit(s) not contained in main)"
              continue
            fi
            if ! git diff --quiet refs/remotes/origin/main "$git_ref"; then
              echo "HOLD: $branch (tree differs from main; selective extraction required)"
              continue
            fi

            # Dry-run must not create tags or delete refs.
            if [ "$EXECUTE" != "true" ]; then
              echo "DRY RUN: would archive $branch -> $tag @ $head_sha and then delete the branch"
              continue
            fi

            if gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; then
              existing_sha="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')"
              if [ "$existing_sha" != "$head_sha" ]; then
                echo "HOLD: $branch (archive tag exists at a different commit)"
                continue
              fi
              echo "ARCHIVE VERIFIED: $branch -> $tag @ $head_sha"
            else
              gh api --method POST "repos/$repo/git/refs" \
                -f "ref=refs/tags/$tag" \
                -f "sha=$head_sha"
              echo "ARCHIVED: $branch -> $tag @ $head_sha"
            fi

            current_sha="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
            archive_sha="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')"
            if [ "$current_sha" != "$head_sha" ] || [ "$archive_sha" != "$head_sha" ]; then
              echo "HOLD: $branch (branch head moved or archive SHA is not exact)"
              continue
            fi
            gh api --method DELETE "repos/$repo/git/refs/heads/$branch"
            if gh api "repos/$repo/git/ref/heads/$branch" >/dev/null 2>&1; then
              echo "ERROR: branch ref still exists after deletion: $branch"
              exit 2
            fi
            echo "DELETED AFTER VERIFIED ARCHIVE: $branch"
          done

          remaining="$(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name' | sort)"
          expected="$(printf '%s\n' "${sanctioned[@]}" | sort)"
          remaining_count="$(printf '%s\n' "$remaining" | wc -l | tr -d ' ')"
          echo "Remaining physical branch refs: $remaining_count"

          if [ "$EXECUTE" = "true" ] && [ "$remaining" != "$expected" ]; then
            echo "Retirement incomplete: physical refs do not match the exact sanctioned inventory."
              printf 'Actual refs:\n%s\nExpected refs:\n%s\n' "$remaining" "$expected"
            exit 2
          fi

  retire-superseded-persistence-provider-wiring:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Verify PR #226 convergence, then archive and retire superseded PR #250 ref
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="fix/persistence-provider-wiring"
          expected_head="3363ca203e295a1c28bd15b58d1893cd92c5b1b0"
          tag="archive/branches/$branch"
          git_ref="refs/remotes/origin/persistence-provider-retirement"

          # PR #250 is redundant only after its equivalent implementation is on main.
          pr226="$(gh api "repos/$REPO/pulls/226")"
          pr226_merged_at="$(jq -r '.merged_at // empty' <<<"$pr226")"
          if [ -z "$pr226_merged_at" ]; then
            echo "::error::Cannot retire PR #250's ref before PR #226 is merged."
            exit 2
          fi

          pr250="$(gh api "repos/$REPO/pulls/250")"
          if [ "$(jq -r '.state' <<<"$pr250")" != "closed" ] ||
             [ -n "$(jq -r '.merged_at // empty' <<<"$pr250")" ] ||
             [ "$(jq -r '.head.ref' <<<"$pr250")" != "$branch" ] ||
             [ "$(jq -r '.head.sha' <<<"$pr250")" != "$expected_head" ]; then
            echo "::error::PR #250 is not the expected closed, unmerged, immutable superseded proposal."
            exit 2
          fi

          count_open_prs_for_branch() {
            local wanted_branch="$1"
            BRANCH="$wanted_branch" REPO="$REPO" \
              gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
                --jq '.[] | select(.head.ref == env.BRANCH and .head.repo.full_name == env.REPO) | .number' \
              | wc -l | tr -d ' '
          }
          open_prs="$(count_open_prs_for_branch "$branch")"
          if [ "$open_prs" != "0" ]; then
            echo "::error::Retirement held: open PRs still reference $branch."
            exit 2
          fi

          # Verify the relevant provider-wiring delta is present on merged main.
          test -f src/platform/composition_repositories.py
          test -f src/platform/surface_repository_graph.py
          test -f tests/test_shared_provider_wiring.py
          grep -q "def create_document_artifact_repository_for_platform" src/platform/composition_repositories.py
          grep -q "def create_consent_repository" src/platform/composition_repositories.py
          grep -q "def create_submission_repository" src/platform/composition_repositories.py
          grep -q "def create_authority_repository" src/platform/composition_repositories.py
          grep -q "get_or_create as _get_or_create" src/platform/surface_case_composition.py
          grep -q "provider_runtime_graph as _provider_runtime_graph" src/platform/surface_case_composition.py
          grep -q "test_postgres_dsn_is_propagated_to_supported_repository_factories" tests/test_shared_provider_wiring.py
          grep -q "test_provider_graph_factory_is_lazy_and_runs_once" tests/test_shared_provider_wiring.py
          dsn_factory_count="$(grep -c 'dsn=os.getenv("JANAVANI_POSTGRES_DSN")' src/platform/composition_repositories.py)"
          if [ "$dsn_factory_count" -lt 4 ]; then
            echo "::error::Merged main does not show DSN propagation for all four reviewed providers."
            exit 2
          fi

          # Distinguish a real 404 from authentication, rate-limit or server failures.
          api_root="https://api.github.com/repos/$REPO"
          branch_response="$(mktemp)"
          branch_http="$(curl -sS -o "$branch_response" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api_root/git/ref/heads/$branch")"
          case "$branch_http" in
            200)
              head_sha="$(jq -r '.object.sha' "$branch_response")"
              ;;
            404)
              archive_sha="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)"
              rm -f "$branch_response"
              if [ "$archive_sha" != "$expected_head" ]; then
                echo "::error::PR #250 branch is absent without an exact-head archive."
                exit 2
              fi
              echo "RETIREMENT ALREADY COMPLETE: exact archive exists at $archive_sha and branch ref is absent."
              exit 0
              ;;
            *)
              cat "$branch_response"
              echo "::error::Unable to verify PR #250 branch ref (HTTP $branch_http)."
              exit 2
              ;;
          esac
          rm -f "$branch_response"
          if [ "$head_sha" != "$expected_head" ]; then
            echo "::error::PR #250 branch moved from the reviewed head; preserving it."
            exit 2
          fi

          git fetch --no-tags origin "+refs/heads/$branch:$git_ref"
          if [ "$(git rev-parse "$git_ref")" != "$expected_head" ]; then
            echo "::error::Fetched PR #250 branch does not match its immutable reviewed head."
            exit 2
          fi

          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            archive_sha="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')"
            if [ "$archive_sha" != "$expected_head" ]; then
              echo "::error::Archive tag already points to a different commit."
              exit 2
            fi
          else
            gh api --method POST "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$expected_head"
          fi
          archive_sha="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')"
          if [ "$archive_sha" != "$expected_head" ]; then
            echo "::error::Archive tag verification failed; preserving branch."
            exit 2
          fi

          # Re-read the mutable ref immediately before deletion.
          branch_response="$(mktemp)"
          branch_http="$(curl -sS -o "$branch_response" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api_root/git/ref/heads/$branch")"
          case "$branch_http" in
            200)
              current_sha="$(jq -r '.object.sha' "$branch_response")"
              if [ "$current_sha" != "$expected_head" ]; then
                rm -f "$branch_response"
                echo "::error::PR #250 branch moved after archive verification; preserving it."
                exit 2
              fi
              rm -f "$branch_response"
              gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
              verify_response="$(mktemp)"
              verify_http="$(curl -sS -o "$verify_response" -w '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$api_root/git/ref/heads/$branch")"
              rm -f "$verify_response"
              if [ "$verify_http" != "404" ]; then
                echo "::error::PR #250 branch was not verified absent after deletion (HTTP $verify_http)."
                exit 2
              fi
              ;;
            404)
              rm -f "$branch_response"
              echo "PR #250 branch was auto-deleted after exact archive verification."
              ;;
            *)
              cat "$branch_response"
              rm -f "$branch_response"
              echo "::error::Unable to re-verify PR #250 branch before deletion (HTTP $branch_http)."
              exit 2
              ;;
          esac
          archive_sha="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')"
          if [ "$archive_sha" != "$expected_head" ]; then
            echo "::error::Post-deletion archive verification failed."
            exit 2
          fi
          echo "ARCHIVE VERIFIED: $tag @ $archive_sha"
          echo "DELETED AFTER VERIFIED ARCHIVE: $branch"

          remaining="$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | sort)"
          printf 'Physical branches after superseded-ref retirement:\n%s\n' "$remaining"
          echo "The PR #243 and #247 retirement jobs own their separate refs; exact-eight compliance is checked after both complete."

  retire-consent-capability-governance:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'feat/capability-activation-governance' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Archive and retire consent governance; preserve the independent evidence-contract PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected_sanctioned_branches() {
            printf '%s\n' \
              main \
              integration/canonical-platform \
              feat/canonical-case-kernel \
              feat/canonical-civic-action-vertical-slice \
              feat/canonical-sos-contract \
              feat/capability-scoped-consent-agent-enforcement \
              audit/postgres-provider-production-gates \
              chore/ecosystem-shared-capability-infrastructure
          }
          branch="feat/capability-activation-governance"
          tag="archive/branches/$branch"
          git_ref="refs/remotes/origin/retirement-candidate"

          count_open_prs_for_branch() {
            local wanted_branch="$1"
            BRANCH="$wanted_branch" REPO="$REPO" \
              gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
                --jq '.[] | select(.head.ref == env.BRANCH and .head.repo.full_name == env.REPO) | .number' \
              | wc -l | tr -d ' '
          }

          open_prs="$(count_open_prs_for_branch "$branch")"
          if [ "$open_prs" != "0" ]; then
            echo "::error::Retirement held: open PRs still reference $branch."
            exit 2
          fi

          # PR #250's code is superseded by PR #226. The dedicated main-push
          # job must first prove that PR #226 is merged, archive the exact #250
          # head and delete its redundant ref. Do not run the consent/evidence
          # count transition while that third temporary ref remains.
          pr226="$(gh api "repos/$REPO/pulls/226")"
          if [ -z "$(jq -r '.merged_at // empty' <<<"$pr226")" ]; then
            echo "::error::PR #226 must be merged before PR #243 branch retirement."
            exit 2
          fi
          provider_branch="fix/persistence-provider-wiring"
          provider_head="3363ca203e295a1c28bd15b58d1893cd92c5b1b0"
          provider_tag="archive/branches/$provider_branch"
          provider_retired=false
          for attempt in $(seq 1 60); do
            live_provider_head="$(gh api "repos/$REPO/git/ref/heads/$provider_branch" --jq '.object.sha' 2>/dev/null || true)"
            archived_provider_head="$(gh api "repos/$REPO/git/ref/tags/$provider_tag" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$live_provider_head" ]; then
              if [ "$archived_provider_head" != "$provider_head" ]; then
                echo "::error::PR #250 ref is absent without an exact-head archive."
                exit 2
              fi
              provider_retired=true
              break
            fi
            if [ "$live_provider_head" != "$provider_head" ]; then
              echo "::error::PR #250 ref moved from its reviewed head; preserving it."
              exit 2
            fi
            echo "Waiting for the PR #250 exact-head archive/deletion job (attempt $attempt/60)."
            sleep 10
          done
          if [ "$provider_retired" != true ]; then
            echo "::error::PR #250 ref was not retired after PR #226 convergence; preserve PR #243 ref."
            exit 2
          fi

          pr_number="${{ github.event.pull_request.number }}"
          pr_author="${{ github.event.pull_request.user.login }}"
          expected_pr_head_sha="${{ github.event.pull_request.head.sha }}"
          if [ -z "$expected_pr_head_sha" ]; then
            echo "::error::Merged PR event does not contain its recorded head SHA."
            exit 2
          fi
          # GitHub may auto-delete a PR head before this workflow starts.
          # Accept only an exact 404 as "already absent"; authentication, rate
          # limit, and server errors must remain hard failures.
          api_root="https://api.github.com/repos/$REPO"
          branch_response="$(mktemp)"
          branch_http="$(curl -sS -o "$branch_response" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api_root/git/ref/heads/$branch")"
          case "$branch_http" in
            200)
              branch_present_at_start=true
              head_sha="$(jq -r '.object.sha' "$branch_response")"
              if [ "$head_sha" != "$expected_pr_head_sha" ]; then
                echo "::error::Consent branch head no longer matches the merged PR event head."
                exit 2
              fi
              git fetch --no-tags origin "refs/heads/$branch:$git_ref"
              ;;
            404)
              branch_present_at_start=false
              head_sha="$expected_pr_head_sha"
              echo "PR head branch is already absent; archive will be created from the immutable PR head ref."
              git fetch --no-tags origin "refs/pull/$pr_number/head:$git_ref"
              ;;
            *)
              cat "$branch_response"
              echo "::error::Unable to verify consent branch ref (HTTP $branch_http)."
              exit 2
              ;;
          esac
          rm -f "$branch_response"
          if [ "$(git rev-parse "$git_ref")" != "$expected_pr_head_sha" ]; then
            echo "::error::Fetched consent PR head does not match the merged PR event head."
            exit 2
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git cat-file -e "$expected_pr_head_sha^{commit}"; then
            echo "::error::Exact merged PR head commit is unavailable for archive verification."
            exit 2
          fi
          if ! git diff --quiet refs/remotes/origin/main "$expected_pr_head_sha"; then
            echo "::error::Retirement held: consent-governance tree differs from merged main."
            exit 2
          fi

          review_rows="$(gh api --paginate "repos/$REPO/pulls/$pr_number/reviews?per_page=100" --jq '.[] | [.user.login, .state, .submitted_at, .commit_id] | @tsv')"
          approved_count="$(
            printf '%s\n' "$review_rows" |
              sort -s -t "$(printf '\t')" -k1,1 -k3,3 |
              awk -F '\t' -v author="$pr_author" -v expected="$expected_pr_head_sha" '
                NF == 4 {
                  latest_state[$1] = $2
                  latest_commit[$1] = $4
                }
                END {
                  for (login in latest_state) {
                    if (login != author &&
                        latest_state[login] == "APPROVED" &&
                        latest_commit[login] == expected) {
                      count++
                    }
                  }
                  print count + 0
                }
              '
          )"
          if [ "$approved_count" -lt 1 ]; then
            echo "::error::Retirement held: PR #$pr_number has no current-head approval from a reviewer other than its author."
            exit 2
          fi

          # Create or verify the archive before considering any ref deletion.
          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            archive_sha="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')"
            if [ "$archive_sha" != "$expected_pr_head_sha" ]; then
              echo "::error::Archive tag exists at a different SHA."
              exit 2
            fi
          else
            gh api --method POST "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$expected_pr_head_sha"
          fi
          archive_sha="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')"
          if [ "$archive_sha" != "$expected_pr_head_sha" ]; then
            echo "::error::Consent archive does not preserve the exact merged PR event head."
            exit 2
          fi

          # Re-read the mutable branch immediately before deletion. If it has
          # already disappeared, leave it absent; if it moved or was recreated,
          # stop rather than deleting a different ref.
          branch_response="$(mktemp)"
          branch_http="$(curl -sS -o "$branch_response" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api_root/git/ref/heads/$branch")"
          case "$branch_http" in
            200)
              if [ "$branch_present_at_start" != true ]; then
                echo "::error::Consent branch was recreated after the initial absence check; preserving it for manual review."
                exit 2
              fi
              current_sha="$(jq -r '.object.sha' "$branch_response")"
              if [ "$current_sha" != "$expected_pr_head_sha" ]; then
                echo "::error::Consent branch moved after archive verification; preserving it."
                exit 2
              fi
              gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
              verify_response="$(mktemp)"
              verify_http="$(curl -sS -o "$verify_response" -w '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$api_root/git/ref/heads/$branch")"
              rm -f "$verify_response"
              if [ "$verify_http" != "404" ]; then
                echo "::error::Consent branch still exists or could not be verified absent after deletion (HTTP $verify_http)."
                exit 2
              fi
              ;;
            404)
              if [ "$branch_present_at_start" = true ]; then
                echo "Consent branch was auto-deleted after initial verification; exact-head archive is preserved."
              else
                echo "Consent branch was already absent after exact-head archive verification; no deletion was needed."
              fi
              ;;
            *)
              cat "$branch_response"
              echo "::error::Unable to re-verify consent branch ref before deletion (HTTP $branch_http)."
              exit 2
              ;;
          esac
          rm -f "$branch_response"

          # PR #247's own close-event workflow is the sole owner of its ref.
          # This job must never delete it: PR #247 may already be waiting for this
          # PR #243 retirement, and duplicate delete requests can race.
          evidence_pr="$(gh api "repos/$REPO/pulls/247")"
          evidence_state="$(jq -r '.state' <<<"$evidence_pr")"
          evidence_merged_at="$(jq -r '.merged_at // empty' <<<"$evidence_pr")"
          evidence_branch="$(jq -r '.head.ref' <<<"$evidence_pr")"
          evidence_head="$(jq -r '.head.sha' <<<"$evidence_pr")"
          evidence_tag="archive/branches/docs/environmental-civic-evidence-contract"
          if [ "$evidence_branch" != "docs/environmental-civic-evidence-contract" ] ||
             [ -z "$evidence_head" ]; then
            echo "::error::PR #247 head identity differs from the expected one-off evidence-contract ref."
            exit 2
          fi
          if [ -n "$evidence_merged_at" ]; then
            evidence_open_prs="$(count_open_prs_for_branch "$evidence_branch")"
            if [ "$evidence_open_prs" != "0" ]; then
              echo "::error::Evidence-contract retirement held: another open PR references its branch."
              exit 2
            fi
            # The #247 workflow alone archives and deletes this ref. Here we
            # verify a coherent inventory whether that job has not started,
            # is finishing concurrently, or has already completed.
            remaining="$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | sort)"
            expected_eight="$(expected_sanctioned_branches | sort)"
            expected_nine="$({ expected_sanctioned_branches; printf '%s\n' "$evidence_branch"; } | sort)"
            if [ "$remaining" = "$expected_eight" ]; then
              evidence_archive="$(gh api "repos/$REPO/git/ref/tags/$evidence_tag" --jq '.object.sha' 2>/dev/null || true)"
              if [ "$evidence_archive" != "$evidence_head" ]; then
                echo "::error::Evidence-contract ref is absent without an archive of the exact merged PR #247 head."
                exit 2
              fi
              echo "PR #247's workflow has retired its own ref; exactly eight sanctioned refs remain."
            elif [ "$remaining" = "$expected_nine" ]; then
              current_evidence_sha="$(gh api "repos/$REPO/git/ref/heads/$evidence_branch" --jq '.object.sha' 2>/dev/null || true)"
              if [ "$current_evidence_sha" != "$evidence_head" ]; then
                # Re-read in case the owning PR #247 workflow deleted it between
                # the inventory snapshot and this ref lookup.
                remaining="$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | sort)"
                evidence_archive="$(gh api "repos/$REPO/git/ref/tags/$evidence_tag" --jq '.object.sha' 2>/dev/null || true)"
                if [ "$remaining" != "$expected_eight" ] ||
                   [ "$evidence_archive" != "$evidence_head" ]; then
                  echo "::error::PR #247 ref moved or disappeared without exact-head archive verification."
                  exit 2
                fi
                echo "PR #247's workflow completed its own retirement during verification; exactly eight sanctioned refs remain."
              else
                echo "PR #243 ref retired. PR #247's exact head remains for its own archive-first retirement workflow."
              fi
            else
              echo "::error::Unexpected physical branch inventory after PR #243 retirement."
              printf 'Actual refs:\n%s\nExpected eight:\n%s\nExpected nine:\n%s\n' "$remaining" "$expected_eight" "$expected_nine"
              exit 2
            fi
          elif [ "$evidence_state" = "open" ]; then
            current_evidence_sha="$(gh api "repos/$REPO/git/ref/heads/$evidence_branch" --jq '.object.sha' 2>/dev/null || true)"
            if [ "$current_evidence_sha" != "$evidence_head" ]; then
              echo "::error::Open PR #247 branch does not match its recorded head."
              exit 2
            fi
            remaining="$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | sort)"
            expected="$({ expected_sanctioned_branches; printf '%s\n' "$evidence_branch"; } | sort)"
            if [ "$remaining" != "$expected" ]; then
              echo "::error::Expected eight sanctioned refs plus the one open PR #247 ref after PR #243 retirement."
              printf 'Actual refs:\n%s\nExpected refs:\n%s\n' "$remaining" "$expected"
              exit 2
            fi
            echo "PR #243 ref retired. PR #247 remains open and its branch is preserved."
          else
            echo "PR #247 was closed without merge; preserve its unique documentation branch for an explicit archive-first disposition."
            remaining="$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | sort)"
            expected="$({ expected_sanctioned_branches; printf '%s\n' "$evidence_branch"; } | sort)"
            if [ "$remaining" != "$expected" ]; then
              echo "::error::Unexpected inventory while preserving closed, unmerged PR #247."
              exit 2
            fi
          fi

  retire-environmental-civic-evidence-contract:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'docs/environmental-civic-evidence-contract' &&
