name: Branch Retirement

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Actually archive and delete eligible legacy branches"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "Type RETIRE-LEGACY-BRANCHES to permit deletion"
        required: true
        type: string
  pull_request:
    types: [closed]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

# Give each PR-close retirement its own durable concurrency slot. GitHub retains only
# one pending run per group; a single global group can silently replace a queued PR event.
# Manual runs are serialized separately and never own the two transition-only refs.
concurrency:
  group: janavani-branch-retirement-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && 'manual' || github.run_id) }}
  cancel-in-progress: false

jobs:
  retire:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Archive and retire legacy branches
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTE: ${{ inputs.execute }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [ "$CONFIRMATION" != "RETIRE-LEGACY-BRANCHES" ]; then
            echo "Invalid confirmation phrase; no refs will be changed."
            exit 1
          fi

          repo="${{ github.repository }}"
          base="main"
          sanctioned=(
            "main"
            "integration/canonical-platform"
            "feat/canonical-case-kernel"
            "feat/canonical-civic-action-vertical-slice"
            "feat/canonical-sos-contract"
            "feat/capability-scoped-consent-agent-enforcement"
            "audit/postgres-provider-production-gates"
            "chore/ecosystem-shared-capability-infrastructure"
          )
          retirement_only=("feat/canonical-capability-execution-envelope")
          transition_only=(
            "feat/capability-activation-governance"
            "docs/environmental-civic-evidence-contract"
          )

          is_sanctioned() {
            local branch="$1"
            for allowed in "${sanctioned[@]}"; do
              [ "$branch" = "$allowed" ] && return 0
            done
            return 1
          }

          is_retirement_only() {
            local branch="$1"
            for candidate in "${retirement_only[@]}"; do
              [ "$branch" = "$candidate" ] && return 0
            done
            return 1
          }

          is_transition_only() {
            local branch="$1"
            for candidate in "${transition_only[@]}"; do
              [ "$branch" = "$candidate" ] && return 0
            done
            return 1
          }

          mapfile -t branches < <(
            gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name'
          )

          count_open_prs_for_branch() {
            local wanted_branch="$1"
            BRANCH="$wanted_branch" REPO="$repo" \
              gh api --paginate "repos/$repo/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.ref == env.BRANCH and .head.repo.full_name == env.REPO) | .number' \
              | wc -l | tr -d ' '
          }

          for branch in "${branches[@]}"; do
            is_sanctioned "$branch" && continue
            if is_retirement_only "$branch"; then
              echo "Retirement-only branch: $branch is deleted only by the post-merge controlled workflow."
              continue
            fi
            if is_transition_only "$branch"; then
              echo "Transition-only branch: $branch is deleted only by its dedicated approval- and archive-gated workflow."
              continue
            fi

            prs="$(count_open_prs_for_branch "$branch")"
            if [ "$prs" != "0" ]; then
              echo "HOLD: $branch (open_prs=$prs)"
              continue
            fi

            head_sha="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
            tag="archive/branches/$branch"
            git_ref="refs/remotes/origin/retirement-candidate"
            git fetch --no-tags origin \
              "+refs/heads/$branch:$git_ref" \
              "+refs/heads/main:refs/remotes/origin/main"
            if [ "$(git rev-parse "$git_ref")" != "$head_sha" ]; then
              echo "HOLD: $branch (GitHub ref and fetched head disagree)"
              continue
            fi
            ahead="$(git rev-list --count "refs/remotes/origin/main..$git_ref")"
            if [ "$ahead" != "0" ]; then
              echo "HOLD: $branch ($ahead commit(s) not contained in main)"
              continue
            fi
            if ! git diff --quiet refs/remotes/origin/main "$git_ref"; then
              echo "HOLD: $branch (tree differs from main; selective extraction required)"
              continue
            fi

            # Dry-run must not create tags or delete refs.
            if [ "$EXECUTE" != "true" ]; then
              echo "DRY RUN: would archive $branch -> $tag @ $head_sha and then delete the branch"
              continue
            fi

            if gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; then
              existing_sha="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')"
              if [ "$existing_sha" != "$head_sha" ]; then
                echo "HOLD: $branch (archive tag exists at a different commit)"
                continue
              fi
              echo "ARCHIVE VERIFIED: $branch -> $tag @ $head_sha"
            else
              gh api --method POST "repos/$repo/git/refs" \
                -f "ref=refs/tags/$tag" \
                -f "sha=$head_sha"
              echo "ARCHIVED: $branch -> $tag @ $head_sha"
            fi

            current_sha="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
            archive_sha="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')"
            if [ "$current_sha" != "$head_sha" ] || [ "$archive_sha" != "$head_sha" ]; then
              echo "HOLD: $branch (branch head moved or archive SHA is not exact)"
              continue
            fi
            gh api --method DELETE "repos/$repo/git/refs/heads/$branch"
            if gh api "repos/$repo/git/ref/heads/$branch" >/dev/null 2>&1; then
              echo "ERROR: branch ref still exists after deletion: $branch"
              exit 2
            fi
            echo "DELETED AFTER VERIFIED ARCHIVE: $branch"
          done

          remaining="$(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name' | sort)"
          expected="$(printf '%s\n' "${sanctioned[@]}" | sort)"
          remaining_count="$(printf '%s\n' "$remaining" | wc -l | tr -d ' ')"
          echo "Remaining physical branch refs: $remaining_count"

          if [ "$EXECUTE" = "true" ] && [ "$remaining" != "$expected" ]; then
            echo "Retirement incomplete: physical refs do not match the exact sanctioned inventory."
              printf 'Actual refs:\n%s\nExpected refs:\n%s\n' "$remaining" "$expected"
            exit 2
          fi

  retire-consent-capability-governance:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'feat/capability-activation-governance' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Archive and retire consent governance; preserve the independent evidence-contract PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected_sanctioned_branches() {
            printf '%s\n' \
              main \
              integration/canonical-platform \
              feat/canonical-case-kernel \
              feat/canonical-civic-action-vertical-slice \
              feat/canonical-sos-contract \
              feat/capability-scoped-consent-agent-enforcement \
              audit/postgres-provider-production-gates \
              chore/ecosystem-shared-capability-infrastructure
          }
          branch="feat/capability-activation-governance"
          tag="archive/branches/$branch"
          git_ref="refs/remotes/origin/retirement-candidate"

          count_open_prs_for_branch() {
            local wanted_branch="$1"
            BRANCH="$wanted_branch" REPO="$REPO" \
              gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
                --jq '.[] | select(.head.ref == env.BRANCH and .head.repo.full_name == env.REPO) | .number' \
              | wc -l | tr -d ' '
          }

          open_prs="$(count_open_prs_for_branch "$branch")"
          if [ "$open_prs" != "0" ]; then
            echo "::error::Retirement held: open PRs still reference $branch."
            exit 2
          fi

          pr_number="${{ github.event.pull_request.number }}"
          pr_author="${{ github.event.pull_request.user.login }}"
          expected_pr_head_sha="${{ github.event.pull_request.head.sha }}"
          if [ -z "$expected_pr_head_sha" ]; then
            echo "::error::Merged PR event does not contain its recorded head SHA."
            exit 2
          fi
          # GitHub may auto-delete a PR head before this workflow starts.
          # Accept only an exact 404 as "already absent"; authentication, rate
          # limit, and server errors must remain hard failures.
          api_root="https://api.github.com/repos/$REPO"
          branch_response="$(mktemp)"
          branch_http="$(curl -sS -o "$branch_response" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api_root/git/ref/heads/$branch")"
          case "$branch_http" in
            200)
              branch_present_at_start=true
              head_sha="$(jq -r '.object.sha' "$branch_response")"
              if [ "$head_sha" != "$expected_pr_head_sha" ]; then
                echo "::error::Consent branch head no longer matches the merged PR event head."
                exit 2
              fi
              git fetch --no-tags origin "refs/heads/$branch:$git_ref"
              ;;
            404)
              branch_present_at_start=false
              head_sha="$expected_pr_head_sha"
              echo "PR head branch is already absent; archive will be created from the immutable PR head ref."
              git fetch --no-tags origin "refs/pull/$pr_number/head:$git_ref"
              ;;
            *)
              cat "$branch_response"
              echo "::error::Unable to verify consent branch ref (HTTP $branch_http)."
              exit 2
              ;;
          esac
          rm -f "$branch_response"
          if [ "$(git rev-parse "$git_ref")" != "$expected_pr_head_sha" ]; then
            echo "::error::Fetched consent PR head does not match the merged PR event head."
            exit 2
          fi
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          if ! git cat-file -e "$expected_pr_head_sha^{commit}"; then
            echo "::error::Exact merged PR head commit is unavailable for archive verification."
            exit 2
          fi
          if ! git diff --quiet refs/remotes/origin/main "$expected_pr_head_sha"; then
            echo "::error::Retirement held: consent-governance tree differs from merged main."
            exit 2
          fi

          review_rows="$(gh api --paginate "repos/$REPO/pulls/$pr_number/reviews?per_page=100" --jq '.[] | [.user.login, .state, .submitted_at, .commit_id] | @tsv')"
          approved_count="$(
            printf '%s\n' "$review_rows" |
              sort -s -t "$(printf '\t')" -k1,1 -k3,3 |
              awk -F '\t' -v author="$pr_author" -v expected="$expected_pr_head_sha" '
                NF == 4 {
                  latest_state[$1] = $2
                  latest_commit[$1] = $4
                }
                END {
                  for (login in latest_state) {
                    if (login != author &&
                        latest_state[login] == "APPROVED" &&
                        latest_commit[login] == expected) {
                      count++
                    }
                  }
                  print count + 0
                }
              '
          )"
          if [ "$approved_count" -lt 1 ]; then
            echo "::error::Retirement held: PR #$pr_number has no current-head approval from a reviewer other than its author."
            exit 2
          fi

          # Create or verify the archive before considering any ref deletion.
          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            archive_sha="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')"
            if [ "$archive_sha" != "$expected_pr_head_sha" ]; then
              echo "::error::Archive tag exists at a different SHA."
              exit 2
            fi
          else
            gh api --method POST "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$expected_pr_head_sha"
          fi
          archive_sha="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')"
          if [ "$archive_sha" != "$expected_pr_head_sha" ]; then
            echo "::error::Consent archive does not preserve the exact merged PR event head."
            exit 2
          fi

          # Re-read the mutable branch immediately before deletion. If it has
          # already disappeared, leave it absent; if it moved or was recreated,
          # stop rather than deleting a different ref.
          branch_response="$(mktemp)"
          branch_http="$(curl -sS -o "$branch_response" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api_root/git/ref/heads/$branch")"
          case "$branch_http" in
            200)
              if [ "$branch_present_at_start" != true ]; then
                echo "::error::Consent branch was recreated after the initial absence check; preserving it for manual review."
                exit 2
              fi
              current_sha="$(jq -r '.object.sha' "$branch_response")"
              if [ "$current_sha" != "$expected_pr_head_sha" ]; then
                echo "::error::Consent branch moved after archive verification; preserving it."
                exit 2
              fi
              gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
              verify_response="$(mktemp)"
              verify_http="$(curl -sS -o "$verify_response" -w '%{http_code}' \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$api_root/git/ref/heads/$branch")"
              rm -f "$verify_response"
              if [ "$verify_http" != "404" ]; then
                echo "::error::Consent branch still exists or could not be verified absent after deletion (HTTP $verify_http)."
                exit 2
              fi
              ;;
            404)
              if [ "$branch_present_at_start" = true ]; then
                echo "Consent branch was auto-deleted after initial verification; exact-head archive is preserved."
              else
                echo "Consent branch was already absent after exact-head archive verification; no deletion was needed."
              fi
              ;;
            *)
              cat "$branch_response"
              echo "::error::Unable to re-verify consent branch ref before deletion (HTTP $branch_http)."
              exit 2
              ;;
          esac
          rm -f "$branch_response"

          # PR #247 is the only other approved temporary ref. Retire it here
          # too when it was merged before PR #243; otherwise preserve it until
          # its own merge event after this workflow is present on main.
          evidence_pr="$(gh api "repos/$REPO/pulls/247")"
          evidence_state="$(jq -r '.state' <<<"$evidence_pr")"
          evidence_merged_at="$(jq -r '.merged_at // empty' <<<"$evidence_pr")"
          evidence_branch="$(jq -r '.head.ref' <<<"$evidence_pr")"
          if [ "$evidence_branch" != "docs/environmental-civic-evidence-contract" ]; then
            echo "::error::PR #247 head branch differs from the expected one-off evidence-contract ref."
            exit 2
          fi
          evidence_tag="archive/branches/docs/environmental-civic-evidence-contract"
          if [ -n "$evidence_merged_at" ]; then
            evidence_head="$(jq -r '.head.sha' <<<"$evidence_pr")"
            evidence_open_prs="$(count_open_prs_for_branch "$evidence_branch")"
            if [ "$evidence_open_prs" != "0" ]; then
              echo "::error::Evidence-contract retirement held: another open PR references its branch."
              exit 2
            fi
            git fetch --no-tags origin "refs/heads/$evidence_branch:refs/remotes/origin/evidence-retirement"
            if [ "$(git rev-parse refs/remotes/origin/evidence-retirement)" != "$evidence_head" ] ||
               ! git diff --quiet refs/remotes/origin/main refs/remotes/origin/evidence-retirement; then
              echo "::error::Evidence-contract ref/head or merged-tree verification failed."
              exit 2
            fi
            if gh api "repos/$REPO/git/ref/tags/$evidence_tag" >/dev/null 2>&1; then
              evidence_archive="$(gh api "repos/$REPO/git/ref/tags/$evidence_tag" --jq '.object.sha')"
              if [ "$evidence_archive" != "$evidence_head" ]; then
                echo "::error::Evidence-contract archive tag points to a different SHA."
                exit 2
              fi
            else
              gh api --method POST "repos/$REPO/git/refs" -f "ref=refs/tags/$evidence_tag" -f "sha=$evidence_head"
            fi
            # Re-read both mutable refs immediately before deletion. The archive
            # must preserve the exact PR head, and the live branch must not have
            # advanced since the initial fetch/archive verification.
            evidence_archive="$(gh api "repos/$REPO/git/ref/tags/$evidence_tag" --jq '.object.sha')"
            current_evidence_sha="$(gh api "repos/$REPO/git/ref/heads/$evidence_branch" --jq '.object.sha')"
            if [ "$evidence_archive" != "$evidence_head" ] ||
               [ "$current_evidence_sha" != "$evidence_head" ]; then
              echo "::error::Evidence-contract archive or branch head changed before deletion."
              exit 2
            fi
            gh api --method DELETE "repos/$REPO/git/refs/heads/$evidence_branch"
            if gh api "repos/$REPO/git/ref/heads/$evidence_branch" >/dev/null 2>&1; then
              echo "::error::Evidence-contract ref still exists after deletion."
              exit 2
            fi
            remaining="$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | sort)"
            expected="$(expected_sanctioned_branches | sort)"
            if [ "$remaining" != "$expected" ]; then
              echo "::error::Expected exactly the eight sanctioned refs after both retirements."
              printf 'Actual refs:\n%s\nExpected refs:\n%s\n' "$remaining" "$expected"
              exit 2
            fi
            echo "RETIREMENT VERIFIED: both temporary PR refs archived and deleted; exactly eight refs remain."
          elif [ "$evidence_state" = "open" ]; then
            if ! gh api "repos/$REPO/git/ref/heads/$evidence_branch" >/dev/null 2>&1; then
              echo "::error::Open PR #247 branch ref is unexpectedly missing."
              exit 2
            fi
            remaining="$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | sort)"
            expected="$({ expected_sanctioned_branches; printf '%s\n' docs/environmental-civic-evidence-contract; } | sort)"
            if [ "$remaining" != "$expected" ]; then
              echo "::error::Expected eight sanctioned refs plus the one open PR #247 ref after PR #243 retirement."
              printf 'Actual refs:\n%s\nExpected refs:\n%s\n' "$remaining" "$expected"
              exit 2
            fi
            echo "CONSENT BRANCH RETIRED: exactly eight sanctioned refs and PR #247's one documented temporary ref remain."
          else
            echo "::error::PR #247 was closed without merge. Preserve its unique documentation branch; manual archive-first disposition is required."
            exit 2
          fi

  retire-environmental-civic-evidence-contract:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'docs/environmental-civic-evidence-contract' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Archive and retire environmental evidence contract after consent governance
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          expected_sanctioned_branches() {
            printf '%s\n' \
              main \
              integration/canonical-platform \
              feat/canonical-case-kernel \
              feat/canonical-civic-action-vertical-slice \
              feat/canonical-sos-contract \
              feat/capability-scoped-consent-agent-enforcement \
              audit/postgres-provider-production-gates \
              chore/ecosystem-shared-capability-infrastructure
          }
          branch="docs/environmental-civic-evidence-contract"
          tag="archive/branches/$branch"
          git_ref="refs/remotes/origin/evidence-retirement"
          expected_pr_head_sha="${{ github.event.pull_request.head.sha }}"
          if [ -z "$expected_pr_head_sha" ]; then
            echo "::error::Merged PR #247 event does not contain its recorded head SHA."
            exit 2
          fi
          count_open_prs_for_branch() {
            local wanted_branch="$1"
            BRANCH="$wanted_branch" REPO="$REPO" \
              gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
                --jq '.[] | select(.head.ref == env.BRANCH and .head.repo.full_name == env.REPO) | .number' \
              | wc -l | tr -d ' '
          }
          consent_tag="archive/branches/feat/capability-activation-governance"
          consent_ready=false
          for attempt in $(seq 1 60); do
            consent_pr="$(gh api "repos/$REPO/pulls/243")"
            consent_merged_at="$(jq -r '.merged_at // empty' <<<"$consent_pr")"
            consent_head="$(jq -r '.head.sha' <<<"$consent_pr")"
            consent_branch_exists=true
            if ! gh api "repos/$REPO/git/ref/heads/feat/capability-activation-governance" >/dev/null 2>&1; then
              consent_branch_exists=false
            fi
            consent_archive="$(gh api "repos/$REPO/git/ref/tags/$consent_tag" --jq '.object.sha' 2>/dev/null || true)"
            if [ -n "$consent_merged_at" ] &&
               [ "$consent_branch_exists" = false ] &&
               [ "$consent_archive" != "$consent_head" ]; then
              echo "::error::Retirement held: PR #243 archive is missing or does not match its merged head."
              exit 2
            fi
            if [ -n "$consent_merged_at" ] &&
               [ "$consent_branch_exists" = false ] &&
               [ "$consent_archive" = "$consent_head" ]; then
              consent_ready=true
              break
            fi
            echo "Waiting for PR #243 merge and exact-head archive-first retirement (attempt $attempt/60)."
            sleep 10
          done
          if [ "$consent_ready" != true ]; then
            echo "::error::Retirement held: PR #243 did not complete merge and exact-head archive retirement within 10 minutes."
            exit 2
          fi
          open_prs="$(count_open_prs_for_branch "$branch")"
          if [ "$open_prs" != "0" ]; then
            echo "::error::Retirement held: another open PR references $branch."
            exit 2
          fi
          if ! gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            evidence_pr="$(gh api "repos/$REPO/pulls/247")"
            evidence_merged_at="$(jq -r '.merged_at // empty' <<<"$evidence_pr")"
            evidence_api_head="$(jq -r '.head.sha' <<<"$evidence_pr")"
            evidence_archive="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null || true)"
            if [ -z "$evidence_merged_at" ] ||
               [ "$evidence_api_head" != "$expected_pr_head_sha" ] ||
               [ "$evidence_archive" != "$expected_pr_head_sha" ]; then
              echo "::error::Evidence-contract ref is absent without an archive of the exact closed PR head."
              exit 2
            fi
            remaining="$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | sort)"
            expected="$(expected_sanctioned_branches | sort)"
            if [ "$remaining" != "$expected" ]; then
              echo "::error::Evidence-contract ref is already absent but the eight-ref inventory is not exact."
              printf 'Actual refs:\n%s\nExpected refs:\n%s\n' "$remaining" "$expected"
              exit 2
            fi
            echo "RETIREMENT VERIFIED: PR #243 workflow already archived and retired this merged evidence-contract ref; exactly eight refs remain."
            exit 0
          fi

          head_sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
          if [ "$head_sha" != "$expected_pr_head_sha" ]; then
            echo "::error::Evidence-contract live branch no longer matches the closed PR #247 head."
            exit 2
          fi
          git fetch --no-tags origin "refs/heads/$branch:$git_ref"
          if [ "$(git rev-parse "$git_ref")" != "$expected_pr_head_sha" ] ||
             ! git diff --quiet refs/remotes/origin/main "$git_ref"; then
            echo "::error::Evidence-contract fetched head/tree differs from the closed PR #247 head or merged main."
            exit 2
          fi
          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            archive_sha="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')"
            if [ "$archive_sha" != "$expected_pr_head_sha" ]; then
              echo "::error::Evidence-contract archive tag points to a different closed PR head."
              exit 2
            fi
          else
            gh api --method POST "repos/$REPO/git/refs" -f "ref=refs/tags/$tag" -f "sha=$expected_pr_head_sha"
          fi
          archive_sha="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')"
          current_sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
          if [ "$archive_sha" != "$expected_pr_head_sha" ] ||
             [ "$current_sha" != "$expected_pr_head_sha" ]; then
            echo "::error::Evidence-contract archive/head verification failed against the closed PR #247 event head."
            exit 2
          fi
          gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
          if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            echo "::error::Evidence-contract branch still exists after deletion."
            exit 2
          fi
          remaining="$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | sort)"
          expected="$(expected_sanctioned_branches | sort)"
          if [ "$remaining" != "$expected" ]; then
            echo "::error::Expected exactly the eight sanctioned refs after evidence-contract retirement."
              printf 'Actual refs:\n%s\nExpected refs:\n%s\n' "$remaining" "$expected"
            exit 2
          fi
          echo "RETIREMENT VERIFIED: evidence-contract branch archived, deleted and exactly eight refs remain."

  retire-canonical-capability-envelope:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.ref == 'feat/canonical-capability-execution-envelope' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Archive, verify and retire the merged transition branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="feat/canonical-capability-execution-envelope"
          tag="archive/branches/$branch"
          git_ref="refs/remotes/origin/retirement-candidate"

          # The merged governance PR is the only event allowed to retire this
          # sanctioned transition ref. Its content must already be identical
          # to main. Do not require commit ancestry: squash/rebase merges can
          # legitimately rewrite commit identities while preserving the tree.
          count_open_prs_for_branch() {
            local wanted_branch="$1"
            BRANCH="$wanted_branch" REPO="$REPO" \
              gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.ref == env.BRANCH and .head.repo.full_name == env.REPO) | .number' \
              | wc -l | tr -d ' '
          }
          prs="$(count_open_prs_for_branch "$branch")"
          if [ "$prs" != "0" ]; then
            echo "::error::Retirement held: open PRs still reference $branch."
            exit 2
          fi

          head_sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
          git fetch --no-tags origin "refs/heads/$branch:$git_ref"
          if [ "$(git rev-parse "$git_ref")" != "$head_sha" ]; then
            echo "::error::Retirement held: fetched ref does not match GitHub head."
            exit 2
          fi

          if ! git diff --quiet refs/remotes/origin/main "$git_ref"; then
            echo "::error::Retirement held: branch tree differs from main."
            exit 2
          fi

          if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
            archive_sha="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')"
            if [ "$archive_sha" != "$head_sha" ]; then
              echo "::error::Retirement held: archive tag already points to a different SHA."
              exit 2
            fi
            echo "ARCHIVE VERIFIED: $branch -> $tag @ $head_sha"
          else
            gh api --method POST "repos/$REPO/git/refs" \
              -f "ref=refs/tags/$tag" \
              -f "sha=$head_sha"
          fi

          archive_sha="$(gh api "repos/$REPO/git/ref/tags/$tag" --jq '.object.sha')"
          current_sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
          if [ "$archive_sha" != "$head_sha" ] || [ "$current_sha" != "$head_sha" ]; then
            echo "::error::Retirement held: branch head changed or archive SHA is not exact."
            exit 2
          fi

          gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
          remaining="$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | wc -l | tr -d ' ')"
          if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            echo "::error::Retirement failed: branch ref still exists."
            exit 2
          fi
          if [ "$remaining" -ne 8 ]; then
            echo "::error::Expected exactly eight physical branches after retirement; found $remaining."
            exit 2
          fi
          echo "RETIREMENT VERIFIED: exact archive exists, ref is deleted, and eight physical branches remain."

  retire-rejected-vercel-analytics:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Archive exact rejected head and governance head, then verify eight refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch="vercel/install-vercel-web-analytics-6417ji"
          original_head="697ef531d9a02ab9a03b9986efa6b0a633766985"
          original_tag="archive/rejected-analytics/$branch"
          tag="archive/branches/$branch"
          git_ref="refs/remotes/origin/retirement-candidate"

          count_open_prs_for_branch() {
            local wanted_branch="$1"
            BRANCH="$wanted_branch" REPO="$REPO" \
              gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" \
              --jq '.[] | select(.head.ref == env.BRANCH and .head.repo.full_name == env.REPO) | .number' \
              | wc -l | tr -d ' '
          }
          prs="$(count_open_prs_for_branch "$branch")"
          if [ "$prs" != "0" ]; then
            echo "::error::Retirement held: open PRs still reference $branch."
            exit 2
          fi

          head_sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
          git fetch --no-tags origin "+refs/heads/$branch:$git_ref" "+refs/heads/main:refs/remotes/origin/main"
          if [ "$(git rev-parse "$git_ref")" != "$head_sha" ]; then
            echo "::error::Retirement held: fetched head differs from GitHub ref."
            exit 2
          fi
          if ! git diff --quiet refs/remotes/origin/main "$git_ref"; then
            echo "::error::Retirement held: governance branch tree is not identical to merged main."
            exit 2
          fi
          if ! git merge-base --is-ancestor "$original_head" "$git_ref"; then
            echo "::error::Original rejected analytics head is not in the archived branch history."
            exit 2
          fi

          ensure_tag() {
            local tag_name="$1"
            local expected_sha="$2"
            local actual_sha
            if gh api "repos/$REPO/git/ref/tags/$tag_name" >/dev/null 2>&1; then
              actual_sha="$(gh api "repos/$REPO/git/ref/tags/$tag_name" --jq '.object.sha')"
              if [ "$actual_sha" != "$expected_sha" ]; then
                echo "::error::Archive tag $tag_name already points to $actual_sha, expected $expected_sha."
                exit 2
              fi
            else
              gh api --method POST "repos/$REPO/git/refs" -f "ref=refs/tags/$tag_name" -f "sha=$expected_sha"
            fi
            actual_sha="$(gh api "repos/$REPO/git/ref/tags/$tag_name" --jq '.object.sha')"
            if [ "$actual_sha" != "$expected_sha" ]; then
              echo "::error::Archive verification failed for $tag_name."
              exit 2
            fi
            echo "ARCHIVE VERIFIED: $tag_name @ $actual_sha"
          }

          # Preserve the rejected analytics proposal's exact pre-transition commit explicitly.
          ensure_tag "$original_tag" "$original_head"
          # Then archive the exact final ref head that this workflow is about to delete.
          ensure_tag "$tag" "$head_sha"

          current_sha="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
          if [ "$current_sha" != "$head_sha" ]; then
            echo "::error::Branch head changed after archive verification."
            exit 2
          fi
          gh api --method DELETE "repos/$REPO/git/refs/heads/$branch"
          if gh api "repos/$REPO/git/ref/heads/$branch" >/dev/null 2>&1; then
            echo "::error::Branch still exists after deletion: $branch"
            exit 2
          fi

          remaining="$(gh api --paginate "repos/$REPO/branches?per_page=100" --jq '.[].name' | wc -l | tr -d ' ')"
          echo "Remaining physical branch refs: $remaining"
          if [ "$remaining" -ne 8 ]; then
            echo "::error::Expected eight physical refs after retirement; found $remaining."
            exit 2
          fi
          echo "RETIREMENT VERIFIED: rejected head and transition head archived, branch deleted, eight refs remain."
