name: Branch Retirement

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Actually archive and delete non-sanctioned branches"
        required: true
        default: false
        type: boolean
      confirmation:
        description: "Type RETIRE-LEGACY-BRANCHES to permit deletion"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read

jobs:
  retire:
    runs-on: ubuntu-latest
    steps:
      - name: Archive and retire legacy branches
        env:
          GH_TOKEN: ${{ github.token }}
          EXECUTE: ${{ inputs.execute }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [ "$CONFIRMATION" != "RETIRE-LEGACY-BRANCHES" ]; then
            echo "Invalid confirmation phrase; no refs will be changed."
            exit 1
          fi

          repo="${{ github.repository }}"
          base="main"
          sanctioned=(
            "main"
            "integration/canonical-platform"
            "feat/canonical-case-kernel"
            "feat/canonical-capability-execution-envelope"
            "feat/canonical-civic-action-vertical-slice"
            "feat/canonical-sos-contract"
            "feat/capability-scoped-consent-agent-enforcement"
            "audit/postgres-provider-production-gates"
            "chore/ecosystem-shared-capability-infrastructure"
          )

          is_sanctioned() {
            local branch="$1"
            for allowed in "${sanctioned[@]}"; do
              [ "$branch" = "$allowed" ] && return 0
            done
            return 1
          }

          mapfile -t branches < <(
            gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name'
          )

          for branch in "${branches[@]}"; do
            is_sanctioned "$branch" && continue

            prs="$(gh api "repos/$repo/pulls?state=open&head=$repo:$branch&per_page=100" --jq 'length')"
            if [ "$prs" != "0" ]; then
              echo "HOLD: $branch (open_prs=$prs)"
              continue
            fi

            head_sha="$(gh api "repos/$repo/git/ref/heads/$branch" --jq '.object.sha')"
            tag="archive/branches/$branch"

            if gh api "repos/$repo/git/ref/tags/$tag" >/dev/null 2>&1; then
              existing_sha="$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')"
              if [ "$existing_sha" != "$head_sha" ]; then
                echo "HOLD: $branch (archive tag exists at a different commit)"
                continue
              fi
            else
              gh api --method POST "repos/$repo/git/refs"                 -f "ref=refs/tags/$tag"                 -f "sha=$head_sha"
              echo "ARCHIVED: $branch -> $tag @ $head_sha"
            fi

            if [ "$EXECUTE" = "true" ]; then
              gh api --method DELETE "repos/$repo/git/refs/heads/$branch"
              echo "DELETED: $branch"
            fi
          done

          remaining="$(gh api --paginate "repos/$repo/branches?per_page=100" --jq '.[].name' | wc -l | tr -d ' ')"
          echo "Remaining physical branch refs: $remaining"

          if [ "$EXECUTE" = "true" ] && [ "$remaining" -ne 9 ]; then
            echo "Retirement incomplete: open-PR or archive-integrity holds remain."
            exit 2
          fi
