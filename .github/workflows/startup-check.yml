name: Startup check

on:
  push:
  pull_request:

jobs:
  startup-check:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install requirements
        run: pip install --no-cache-dir -r requirements.txt

      - name: Verify canonical FastAPI startup
        run: |
          python - <<'PY'
          from src.web.canonical_app import app
          from fastapi.testclient import TestClient

          client = TestClient(app)
          assert client.get('/liveness').status_code == 200
          assert client.get('/liveness').json() == {'status': 'alive'}
          assert client.get('/version').status_code == 200
          assert client.get('/openapi.json').status_code == 200
          print('Canonical FastAPI startup: OK')
          PY

      - name: Verify canonical route authority
        run: |
          python - <<'PY'
          from src.web.canonical_app import app
          from fastapi.testclient import TestClient

          client = TestClient(app)
          paths = set(client.get('/openapi.json').json()['paths'])
          required = {
              '/liveness',
              '/version',
              '/api/v1/feedback/submit',
              '/api/v1/feedback/summary/{office_id}',
              '/api/v1/legislative/directory/{constituency_code}',
              '/api/v1/legislative/dispatch-email',
              '/api/v1/constitutional/bill/{bill_code}',
              '/api/v1/constitutional/generate-objection',
              '/api/v1/land/compile-kml',
          }
          missing = required - paths
          assert not missing, f'Missing canonical routes: {sorted(missing)}'
          print('Canonical route authority: OK')
          PY
