name: Canonical runtime check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  canonical-runtime-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        run: python -m pip install -r requirements.txt

      - name: Compile canonical source
        run: python -m compileall src

      - name: Import canonical FastAPI application
        env:
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          OPENROUTER_API_KEY: mock-verification-token
          HUGGINGFACE_API_KEY: mock-verification-token
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from fastapi import FastAPI
          from src.web.canonical_app import app

          assert isinstance(app, FastAPI), f"Expected FastAPI app, got {type(app)!r}"

          client = TestClient(app)

          response = client.get("/liveness")
          assert response.status_code == 200, response.text
          assert response.json() == {"status": "alive"}, response.text

          response = client.get("/version")
          assert response.status_code == 200, response.text
          assert response.json().get("service") == "janavani-platform-api", response.text
          assert response.json().get("version") == "canonical-m3", response.text

          print("Canonical FastAPI runtime check passed.")
          PY
