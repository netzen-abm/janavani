name: Canonical startup check

on:
  push:
  pull_request:

jobs:
  canonical-startup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile canonical source
        run: python -m compileall src

      - name: Import canonical FastAPI app
        run: |
          python - <<'PY'
          from src.web.canonical_app import app
          assert app is not None
          routes = {getattr(route, 'path', '') for route in app.routes}
          required = {'/liveness', '/version', '/openapi.json'}
          missing = required - routes
          if missing:
              raise SystemExit(f'Missing canonical routes: {sorted(missing)}')
          print('Canonical app import: OK')
          print('Required routes: OK')
          PY

      - name: Validate Compose configuration
        run: docker compose config --quiet
