steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v4
    with:
      python-version: '3.11'

  - name: Upgrade pip
    run: python -m pip install --upgrade pip

  - name: Install requirements (capture)
    run: |
      set -o pipefail
      pip install --no-cache-dir -r requirements.txt 2>&1 | tee pip-install.log

  - name: Write startup-check script
    run: |
      cat > startup_check.py <<'PY'
      import importlib, traceback, sys
      modules = ['src.web','src.bot_messenger','src.bot_whatsapp','src.main']
      found_app = False
      for m in modules:
          try:
              mod = importlib.import_module(m)
              print(f"--- Imported {m}")
              if hasattr(mod, 'app'):
                  app = getattr(mod, 'app')
                  print(f"{m}: has attribute 'app' -> {type(app)}")
                  found_app = True
              else:
                  print(f"{m}: no attribute 'app'")
          except Exception:
              print(f"ERROR importing {m}:")
              traceback.print_exc()
      if not found_app:
          print('\\nNo Flask \"app\" found in inspected modules. Failing with code 2')
          sys.exit(2)
      else:
          print('\\nStartup check: found at least one app instance')
      PY

  - name: Run import/startup checks
    run: |
      set -o pipefail
      python startup_check.py 2>&1 | tee startup-check.log

  - name: Upload logs
    uses: actions/upload-artifact@v4
    with:
      name: startup-check-logs
      path: |
        pip-install.log
        startup-check.log
