name: Decentralized Capability Verification

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/lib.rs"
      - ".github/workflows/verify-decentralized-stack.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "src/lib.rs"
      - ".github/workflows/verify-decentralized-stack.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-independent-features:
    name: Verify Independent Capability Features
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config libclang-dev

      - name: Cache Cargo dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify Rust formatting
        run: cargo fmt --check

      # These are capability scaffolds. Validation proves the feature contracts
      # remain buildable; it does not claim production protocol guarantees.
      - name: Verify Nostr capability scaffold
        run: cargo test --features nostr

      - name: Verify Nym capability scaffold
        run: cargo test --features nym

      - name: Verify Reticulum capability scaffold
        run: cargo test --features reticulum

      - name: Verify ZKP capability scaffold
        run: cargo test --features zkp

      - name: Verify blockchain capability scaffold
        run: cargo test --features blockchain

      - name: Verify Freenet capability scaffold
        run: cargo build --target wasm32-unknown-unknown --features freenet
