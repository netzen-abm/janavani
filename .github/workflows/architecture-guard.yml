name: Architecture Guard

# Deterministic architecture validation; no mutation or automatic merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run deterministic architecture guard
        run: python scripts/architecture_guard.py

      - name: Run cross-language architecture conformance
        run: python scripts/architecture_conformance.py

      - name: Run archive safety evidence
        run: python scripts/archive_safety_evidence.py

      - name: Run serialization schema conformance
        run: python scripts/serialization_schema_conformance.py
