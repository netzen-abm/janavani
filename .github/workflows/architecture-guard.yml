name: Architecture Guard

# Deterministic architecture validation; no mutation or automatic merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run deterministic architecture guard
        run: python scripts/architecture_guard.py

      - name: Run cross-language architecture conformance
        run: python scripts/architecture_conformance.py
