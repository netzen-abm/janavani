name: Pylint

on: [push]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pylint
    - name: Analyse canonical Python code with pylint
      env:
        PYTHONPATH: .
      run: |
        pylint \
          --source-roots=. \
          --disable=C0115,C0116,R0902,R0913,R0917,R0903,C0301,W0212 \
          src/domain/authority.py \
          src/domain/case.py \
          src/domain/consent.py \
          src/domain/document.py \
          src/domain/evidence.py \
          src/domain/submission.py \
          src/application/case_workflow.py \
          src/storage/case_memory_repository.py \
          src/storage/hydration.py \
          src/storage/serialization.py \
          src/storage/supabase_repositories.py \
          src/storage/resource_repositories.py \
          src/storage/relationship_repository.py \
          src/storage/canonical_persistence.py \
          src/web/case_workflow_router.py \
          src/web/canonical_app.py \
          --fail-under=7.0
