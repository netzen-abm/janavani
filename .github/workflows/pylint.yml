name: Pylint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Python errors and duplication in active components
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install repository and Web MVP dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r src/web_mvp/requirements.txt
          python -m pip install pylint pytest fakeredis pydantic-settings redis
      - name: Gate errors and fatal findings in touched components
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          python -m pylint --disable=all --enable=E,F --disable=E0611             src/adapters/agent_client.py             src/adapters/telegram_client.py             src/adapters/web_client.py             src/adapters/meta_graph_client.py             src/adapters/meta_webhook_security.py             src/bot_whatsapp.py src/bot_messenger.py             src/storage/jsonl_store.py src/storage/redis_connection.py             src/storage/cache.py src/storage/analytics.py             src/services/escalation_engine.py src/services/track_complaint.py             src/services/emergency_sos.py src/documents/document_engine.py             src/web_mvp/main.py             tests/test_agent_client.py tests/test_meta_graph_client.py             tests/test_meta_webhook_security.py tests/test_jsonl_store.py             tests/test_redis_connection.py tests/test_web_mvp.py
      - name: Gate duplicate implementation in active service boundaries
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: |
          python -m pylint --disable=all --enable=R0801             src/adapters/agent_client.py             src/adapters/telegram_client.py             src/adapters/web_client.py             src/adapters/meta_graph_client.py             src/adapters/meta_webhook_security.py             src/bot_whatsapp.py src/bot_messenger.py             src/storage/jsonl_store.py src/storage/redis_connection.py             src/storage/cache.py src/storage/analytics.py             src/services/escalation_engine.py src/services/track_complaint.py             src/services/emergency_sos.py src/documents/document_engine.py             src/web_mvp/main.py

  full-style-audit:
    name: Full-repository style audit (tracked baseline debt)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install repository and Web MVP dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r src/web_mvp/requirements.txt
          python -m pip install pylint pytest fakeredis pydantic-settings redis
      - name: Report full-repository Pylint findings
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
        run: python -m pylint src tests
