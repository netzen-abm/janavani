name: Pip requirements check

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pip-check:
    name: Pip requirements check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install requirements (capture output)
        run: |
          set -o pipefail
          pip --version
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt 2>&1 | tee pip-install.log

      - name: Upload pip log
        uses: actions/upload-artifact@v4
        with:
          name: pip-install-log
          path: pip-install.log
