name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  branch-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enforce eight-branch policy
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          REF_BRANCH: ${{ github.ref_name }}
        run: |
          branch="${HEAD_BRANCH:-${REF_BRANCH}}"
          case "$branch" in
            main|integration/canonical-platform|feat/canonical-case-kernel) 
              echo "Allowed branch role: $branch"
              ;;
            feat/canonical-civic-action-vertical-slice|feat/canonical-sos-contract|feat/capability-scoped-consent-agent-enforcement)
              echo "Allowed branch role: $branch"
              ;;
            audit/postgres-provider-production-gates|chore/ecosystem-shared-capability-infrastructure)
              echo "Allowed branch role: $branch"
              ;;
            *)
              echo "::error::Janavani branch budget violation: '$branch' is outside the eight approved branch roles."
              exit 1
              ;;
          esac

      - name: Enforce physical branch budget on canonical repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t branches < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" --jq '.[].name' | sort)
          count="${#branches[@]}"
          echo "Observed physical branch refs in ${GITHUB_REPOSITORY}: $count"
          printf '%s\n' "${branches[@]}"
          if [ "$count" -ne 8 ]; then
            echo "::error::Janavani requires exactly eight physical branch refs; observed $count."
            echo "::error::Archive and retire only non-sanctioned branches, then re-run this gate."
            exit 1
          fi

  canonical-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: janavani
          POSTGRES_PASSWORD: janavani-test
          POSTGRES_DB: janavani_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U janavani -d janavani_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e '.[postgres]'
          python -m pip install pytest fakeredis ruff

      - name: Run canonical test suite
        env:
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          OPENROUTER_API_KEY: mock-verification-token
          HF_TOKEN: mock-verification-token
          JANAVANI_POSTGRES_TEST_DSN: postgresql://janavani:janavani-test@localhost:5432/janavani_test
        run: bash ./run_all_tests.sh

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: janavani
          POSTGRES_PASSWORD: janavani-test
          POSTGRES_DB: janavani_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U janavani -d janavani_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e '.[postgres]'
          python -m pip install pytest fakeredis ruff

      - name: Python syntax check
        run: python -m compileall -q src

      - name: Enforce active-source 180-line ceiling
        run: python scripts/check_code_line_limits.py --limit 180

      - name: Dependency integrity check
        run: python -m pip check

      - name: Static analysis baseline
        continue-on-error: true
        run: python -m ruff check src --output-format=github

      - name: Run smoke tests
        run: python -m pytest -q tests/test_smoke.py

      - name: Run isolated Telegram inbox worker regression gate
        timeout-minutes: 1
        run: timeout --signal=TERM --kill-after=5s 30s python -m pytest -vv -s -o faulthandler_timeout=5 tests/test_telegram_inbox_worker.py

      - name: Canonical Web vertical-slice gate
        env:
          JANAVANI_IDENTITY_ASSERTION_SECRET: test-identity-secret
        run: python -m pytest -q tests/test_canonical_app.py tests/test_web_civic_action_e2e.py

      - name: Web/Telegram shared-capability gate
        run: python -m pytest -q tests/test_web_telegram_shared_case_contract.py

      - name: Run live PostgreSQL RLS isolation gate
        env:
          JANAVANI_POSTGRES_TEST_DSN: postgresql://janavani:janavani-test@localhost:5432/janavani_test
        run: python -m pytest -q tests/test_postgres_rls_live.py

      - name: Run live PostgreSQL identity-pairing gate
        env:
          JANAVANI_POSTGRES_TEST_DSN: postgresql://janavani:janavani-test@localhost:5432/janavani_test
        run: python -m pytest -q tests/test_postgres_identity_pairing.py

      - name: Run live PostgreSQL Telegram inbox gate
        env:
          JANAVANI_POSTGRES_TEST_DSN: postgresql://janavani:janavani-test@localhost:5432/janavani_test
        run: python -m pytest -q tests/test_postgres_telegram_inbox.py

      - name: Run live PostgreSQL Web–Telegram continuity and atomic-consent gates
        env:
          JANAVANI_POSTGRES_TEST_DSN: postgresql://janavani:janavani-test@localhost:5432/janavani_test
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/postgres-continuity-junit.xml"
          python -m pytest -vv -rs --junitxml="$report" \
            tests/test_postgres_web_telegram_case_continuity.py \
            tests/test_postgres_consent_case_atomic.py
          python - "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          cases = {case.attrib.get("name"): case for case in root.iter("testcase")}
          required = {
              "test_web_and_telegram_share_postgres_case_and_verified_principal",
              "test_postgres_atomic_consent_case_replay_is_idempotent_after_lost_response",
          }
          missing = required - cases.keys()
          if missing:
              raise SystemExit(f"Required integration tests not collected: {sorted(missing)}")
          for name in sorted(required):
              case = cases[name]
              if case.find("skipped") is not None:
                  raise SystemExit(f"Required integration test was skipped: {name}")
              if case.find("failure") is not None or case.find("error") is not None:
                  raise SystemExit(f"Required integration test failed: {name}")
              print(f"Required integration test passed: {name}")
          PY

      - name: Prove PostgreSQL backup and restore integrity
        env:
          PGHOST: localhost
          PGUSER: janavani
          PGPASSWORD: janavani-test
          PGDATABASE: janavani_test
        run: |
          set -euo pipefail
          # Seed a non-empty identity mapping so backup/restore proves that
          # cross-surface identity data survives, not merely an empty table.
          psql --no-psqlrc --set=ON_ERROR_STOP=1 --dbname=janavani_test <<'SQL'
          INSERT INTO public.external_identity_links
            (provider, subject, principal_id, authentication_method, verified)
          VALUES
            ('backup-restore-test', 'ci-identity-subject', 'janavani:ci-identity-principal', 'ci_fixture', true)
          ON CONFLICT (provider, subject) DO UPDATE SET
            principal_id = EXCLUDED.principal_id,
            authentication_method = EXCLUDED.authentication_method,
            verified = EXCLUDED.verified;
          SQL

          backup_dir="$RUNNER_TEMP"
          backup_file="$backup_dir/janavani-ci.backup"

          # Use a PostgreSQL 16 client against the PostgreSQL 16 service. The
          # hosted runner's default client can be newer and emit SET commands
          # that the service server does not understand (for example
          # transaction_timeout on PostgreSQL 16).
          docker run --rm --network host \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=5432 \
            -e PGUSER \
            -e PGPASSWORD \
            -e PGDATABASE \
            -v "$backup_dir:/backup" \
            postgres:16 \
            pg_dump --format=custom --no-owner --no-privileges --file=/backup/janavani-ci.backup
          test -s "$backup_file"

          createdb janavani_restore_test
          docker run --rm --network host \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=5432 \
            -e PGUSER \
            -e PGPASSWORD \
            -e PGDATABASE=janavani_restore_test \
            -v "$backup_dir:/backup" \
            postgres:16 \
            pg_restore --exit-on-error --no-owner --no-privileges --dbname=janavani_restore_test /backup/janavani-ci.backup

          tables=(
            civic_cases civic_case_events civic_case_consents
            civic_case_evidence_refs civic_case_document_refs
            civic_case_submissions civic_case_audit evidence_objects
            document_artifacts external_identity_links
            janavani_delegation_grants janavani_service_identity_policies
          )
          for table in "${tables[@]}"; do
            source_count="$(psql --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 --dbname=janavani_test -c "SELECT count(*) FROM public.$table")"
            restored_count="$(psql --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 --dbname=janavani_restore_test -c "SELECT count(*) FROM public.$table")"
            if [ "$source_count" != "$restored_count" ]; then
              echo "::error::Backup/restore row-count mismatch for $table: source=$source_count restored=$restored_count"
              exit 1
            fi
            echo "Verified restored row count for $table: $restored_count"
          done

          for catalog_query in \
            "SELECT count(*) FROM pg_policies WHERE schemaname = 'public'" \
            "SELECT count(*) FROM pg_constraint c JOIN pg_class t ON t.oid = c.conrelid JOIN pg_namespace n ON n.oid = t.relnamespace WHERE n.nspname = 'public' AND c.convalidated" \
            "SELECT count(*) FROM pg_constraint c JOIN pg_class t ON t.oid = c.conrelid JOIN pg_namespace n ON n.oid = t.relnamespace WHERE n.nspname = 'public' AND c.contype = 'f'"; do
            source_count="$(psql --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 --dbname=janavani_test -c "$catalog_query")"
            restored_count="$(psql --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 --dbname=janavani_restore_test -c "$catalog_query")"
            if [ "$source_count" != "$restored_count" ]; then
              echo "::error::Backup/restore catalog mismatch: source=$source_count restored=$restored_count query=$catalog_query"
              exit 1
            fi
            echo "Verified restored catalog count: $restored_count"
          done

          psql --no-psqlrc --set=ON_ERROR_STOP=1 --dbname=janavani_restore_test <<'SQL'
          DO $$
          DECLARE
            table_name text;
          BEGIN
            FOREACH table_name IN ARRAY ARRAY[
              'civic_cases',
              'civic_case_events',
              'civic_case_consents',
              'civic_case_evidence_refs',
              'civic_case_document_refs',
              'civic_case_submissions',
              'civic_case_audit',
              'evidence_objects',
              'document_artifacts',
              'janavani_delegation_grants',
              'janavani_service_identity_policies'
            ]
            LOOP
              IF NOT EXISTS (
                SELECT 1
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public'
                  AND c.relname = table_name
                  AND c.relrowsecurity
                  AND c.relforcerowsecurity
              ) THEN
                RAISE EXCEPTION 'RLS/ FORCE RLS not preserved for restored table %', table_name;
              END IF;
            END LOOP;
            IF NOT EXISTS (
              SELECT 1 FROM pg_proc p
              JOIN pg_namespace n ON n.oid = p.pronamespace
              WHERE n.nspname = 'janavani_private'
                AND p.proname = 'current_principal_id'
            ) THEN
              RAISE EXCEPTION 'RLS principal function missing after restore';
            END IF;
          END
          $$;
          SQL
      - name: Prove PostgreSQL service restart durability
        env:
          PGHOST: localhost
          PGUSER: janavani
          PGPASSWORD: janavani-test
          PGDATABASE: janavani_test
        run: |
          set -euo pipefail
          container_id="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$container_id"
          # This gate runs in its own job/database, so seed its own durable
          # fixture instead of depending on rows created by canonical-suite.
          psql --no-psqlrc --set=ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.civic_cases
            (case_id, case_type, subject, narrative, created_by, status, created_at, updated_at, version)
          VALUES
            ('pg-atomic-case', 'complaint', 'restart durability fixture', '', 'janavani:ci-test', 'submitted', now(), now(), 2)
          ON CONFLICT (case_id) DO UPDATE SET
            status = EXCLUDED.status, version = EXCLUDED.version, updated_at = EXCLUDED.updated_at;

          INSERT INTO public.civic_case_submissions
            (submission_id, case_id, destination_ref, channel, state, created_at, updated_at, version, idempotency_key)
          VALUES
            ('pg-atomic-submission', 'pg-atomic-case', 'destination:ci-test', 'test', 'submitted', now(), now(), 2, 'pg-atomic-submission-key')
          ON CONFLICT (submission_id) DO UPDATE SET
            state = EXCLUDED.state, version = EXCLUDED.version, updated_at = EXCLUDED.updated_at,
            idempotency_key = EXCLUDED.idempotency_key;

          INSERT INTO public.civic_case_events
            (event_id, case_id, event_type, occurred_at, actor_id, source_channel, notes, event_version, created_at)
          VALUES
            ('pg-atomic-event-1', 'pg-atomic-case', 'submission_recorded', now(), 'janavani:ci-test', 'ci', 'restart durability fixture', 2, now())
          ON CONFLICT (event_id) DO NOTHING;
          SQL
          before="$(psql --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 -c "SELECT count(*) FROM public.civic_case_events WHERE event_id = 'pg-atomic-event-1'")"
          test "$before" = "1"
          docker restart "$container_id"
          for attempt in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U "$PGUSER" -d "$PGDATABASE"; then break; fi
            sleep 2
          done
          pg_isready -h localhost -p 5432 -U "$PGUSER" -d "$PGDATABASE"
          psql --no-psqlrc --set=ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM public.civic_cases WHERE case_id = 'pg-atomic-case' AND status = 'submitted' AND version = 2) THEN
              RAISE EXCEPTION 'Case state did not survive PostgreSQL service restart';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM public.civic_case_submissions WHERE submission_id = 'pg-atomic-submission' AND state = 'submitted' AND version = 2) THEN
              RAISE EXCEPTION 'Submission state did not survive PostgreSQL service restart';
            END IF;
            IF (SELECT count(*) FROM public.civic_case_events WHERE event_id = 'pg-atomic-event-1') <> 1 THEN
              RAISE EXCEPTION 'Lifecycle event count changed after PostgreSQL service restart';
            END IF;
          END
          $$;
          SQL

  # Prove the two deployed ASGI surfaces work with their own minimal runtime
  # dependencies, not only with the monolithic developer/test dependency set.
  surface-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        surface: [api, webapp]
    env:
      JANAVANI_RUNTIME_MODE: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-api.txt
            src/webapp/requirements.txt

      - name: Install the selected surface runtime
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.surface }}" = "api" ]; then
            python -m pip install -r requirements-api.txt
          else
            python -m pip install -r src/webapp/requirements.txt
          fi

      - name: Smoke-test canonical API runtime
        if: matrix.surface == 'api'
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from src.web.canonical_app import app

          client = TestClient(app)
          response = client.get("/liveness")
          assert response.status_code == 200, response.text
          assert response.json() == {"status": "alive"}, response.text
          print("Canonical API slim runtime passed")
          PY

      - name: Smoke-test citizen WebApp runtime and Vercel entrypoint
        if: matrix.surface == 'webapp'
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from src.webapp.main import app, webapp
          from src.webapp.vercel_entrypoint import app as vercel_app

          assert vercel_app is app
          assert app is webapp
          paths = {getattr(route, "path", "") for route in app.routes}
          assert "/" in paths
          assert "/liveness" in paths
          client = TestClient(app)
          response = client.get("/liveness")
          assert response.status_code == 200, response.text
          print("Citizen WebApp slim runtime passed")
          PY
