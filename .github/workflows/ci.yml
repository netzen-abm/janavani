name: CI

on:
  push:
    branches: [ main, feat/decentralized-integrations ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run pytest
        run: |
          pytest -q

  lint_and_syntax:
    name: Lint & Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8
      - name: Run flake8 (reports only)
        # use --exit-zero so lint warnings won't block the pipeline until we're ready to enforce them
        run: flake8 --max-line-length=120 --exit-zero || true
      - name: Syntax check (compileall)
        run: python -m compileall .
