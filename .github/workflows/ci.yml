name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  branch-budget:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce nine-branch policy
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          REF_BRANCH: ${{ github.ref_name }}
        run: |
          branch="${HEAD_BRANCH:-${REF_BRANCH}}"
          case "$branch" in
            main|integration/canonical-platform|feat/canonical-case-kernel|feat/canonical-capability-execution-envelope|feat/canonical-civic-action-vertical-slice|feat/canonical-sos-contract|feat/capability-scoped-consent-agent-enforcement|audit/postgres-provider-production-gates|chore/ecosystem-shared-capability-infrastructure)
              echo "Allowed branch role: $branch"
              ;;
            *)
              echo "::error::Janavani branch budget violation: '$branch' is outside the nine approved branch roles."
              exit 1
              ;;
          esac

      - name: Enforce physical branch budget on canonical line
        if: github.ref_name == 'main' && github.event_name == 'push'
        run: |
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          mapfile -t branches < <(git for-each-ref --format='%(refname:strip=3)' refs/remotes/origin/ | sed '/^$/d' | sort)
          count="${#branches[@]}"
          echo "Observed remote branch refs: $count"
          printf '%s\n' "${branches[@]}"
          if [ "$count" -ne 9 ]; then
            echo "::error::Janavani requires exactly nine physical branch refs; observed $count."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: janavani
          POSTGRES_PASSWORD: janavani-test
          POSTGRES_DB: janavani_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U janavani -d janavani_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e '.[postgres]'
          python -m pip install pytest fakeredis ruff

      - name: Python syntax check
        run: python -m compileall -q src

      - name: Enforce active-source 180-line ceiling
        run: python scripts/check_code_line_limits.py --limit 180

      - name: Dependency integrity check
        run: python -m pip check

      - name: Static analysis baseline
        continue-on-error: true
        run: python -m ruff check src --output-format=github

      - name: Run smoke tests
        run: python -m pytest -q tests/test_smoke.py

      - name: Run canonical test suite
        env:
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          OPENROUTER_API_KEY: mock-verification-token
          HF_TOKEN: mock-verification-token
          JANAVANI_POSTGRES_TEST_DSN: postgresql://janavani:janavani-test@localhost:5432/janavani_test
        run: bash ./run_all_tests.sh

      - name: Run live PostgreSQL RLS isolation gate
        env:
          JANAVANI_POSTGRES_TEST_DSN: postgresql://janavani:janavani-test@localhost:5432/janavani_test
        run: python -m pytest -q tests/test_postgres_rls_live.py
