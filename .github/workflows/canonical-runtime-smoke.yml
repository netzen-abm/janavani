name: Canonical Runtime Smoke Test

on:
  push:
    branches:
      - main
      - "chore/**"
    paths:
      - "requirements.txt"
      - "src/**"
      - ".github/workflows/canonical-runtime-smoke.yml"
  pull_request:
    paths:
      - "requirements.txt"
      - "src/**"
      - ".github/workflows/canonical-runtime-smoke.yml"

permissions:
  contents: read

jobs:
  canonical-runtime:
    name: Import and smoke-test canonical FastAPI runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Import canonical application
        env:
          JANAVANI_TEST_MODE: "1"
        run: python -c "from src.web.canonical_app import app; print(app.title); print('routes=', len(app.routes))"

      - name: Smoke-test FastAPI application
        env:
          JANAVANI_TEST_MODE: "1"
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from src.web.canonical_app import app

          client = TestClient(app)
          response = client.get("/docs")
          assert response.status_code == 200, response.status_code
          print("Canonical FastAPI smoke test: PASS")
          PY
